# 소스 빌드용(개발 · 팀 서버): docker compose up -d --build  →  http://<서버 주소>:7777  (Linux 전용. 사용자 설치는 README 의 docker run 한 줄 — Windows · Mac · Linux)
# server 는 host 네트워크라 고객 앱 · 검사 도구와 같은 localhost 를 본다 (docs/scan.md §2).
# ai 도 host 네트워크(127.0.0.1 에만 listen). 밖에서 보이는 포트는 server(:7777) 하나. ai·postgres 는 127.0.0.1 에만 연다.
services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    network_mode: host # ports 는 무시된다. 포트를 바꾸려면 .env 에 SERVER_PORT=7788
    environment:
      SERVER_PORT: ${SERVER_PORT:-7777}
      AI_BASE_URL: http://localhost:${AI_PORT:-8000}
      DB_URL: jdbc:postgresql://localhost:${DB_PORT:-15432}/${POSTGRES_DB:-ddalkkak}
      DB_USERNAME: ${POSTGRES_USER:-ddalkkak}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ddalkkak}
      DATA_HOST_DIR: ${HOME}/.ddalkkak # 형제 컨테이너(검사 도구) -v 에 쓰는 /root/.ddalkkak 의 호스트 경로 (docs/scan.md §2)
      HOST_HOME: ${HOME} # 사용자가 적는 "내 컴퓨터" · jar 경로의 앞자리. /host-home 아래로 바꿔 읽는다 (docs/run-flow.md §5)
      HOME_MOUNT: /host-home
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # 검사 도구(k6·ZAP·Semgrep) 컨테이너 실행용
      - ~/.ddalkkak:/root/.ddalkkak # 도구 로그 · 코드 작업 폴더 · master.key
      - ${HOME:?HOME 이 비어 있다. 로그인한 일반 사용자 셸에서 띄운다}:/host-home:ro # "내 컴퓨터" · jar 경로
    depends_on:
      ai:
        condition: service_healthy # host 네트워크라 AI 포트가 겹치면 ai 만 죽는다. 그때 up 이 실패해야 키가 그 포트의 남의 프로그램으로 가지 않는다
      postgres:
        condition: service_healthy # 첫 설치 때 DB 초기화가 끝나기 전에 Spring 이 뜨다 죽지 않게

  ai:
    build: ./ai
    # host 네트워크: AI 연결 주소의 localhost 가 이 서버다 (같은 서버의 Ollama localhost:11434 등, -178).
    # 127.0.0.1 에만 열어 밖에서는 보이지 않는다. 겹치면 .env 에 AI_PORT=8001
    network_mode: host
    environment:
      # 직접 연결 주소 중 막지 않을 호스트(쉼표 · host 또는 host:port). 루프백 · 내부 서비스 이름은 기본으로 막혀서(DB · Spring 보호, -172)
      # 같은 서버의 Ollama 기본 포트(localhost · 127.0.0.1 어느 쪽으로 적어도)만 열어 둔다. 다른 로컬 모델은 .env 에 AI_ALLOWED_HOSTS=localhost:11434,localhost:1234
      AI_ALLOWED_HOSTS: ${AI_ALLOWED_HOSTS:-localhost:11434,127.0.0.1:11434}
    command: ["uvicorn", "main:app", "--host", "127.0.0.1", "--port", "${AI_PORT:-8000}"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${AI_PORT:-8000}/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:${DB_PORT:-15432}:5432" # 고객 DB 의 5432 와 겹치지 않게. 겹치면 .env 에 DB_PORT=15433
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ddalkkak}
      POSTGRES_USER: ${POSTGRES_USER:-ddalkkak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ddalkkak}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1: 초기화 중 임시 서버는 소켓만 열어서, TCP 로 물어야 진짜 준비를 안다
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
