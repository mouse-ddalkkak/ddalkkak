  # ───────────────────────── ④ 홈 업데이트 (-221) ─────────────────────────
  /api/update:
    get:
      tags: [④ 화면]
      operationId: getUpdate
      summary: 1 홈 새 버전 띠 — 지금 버전 · 새 버전 · 버튼으로 업데이트할 수 있는지
      description: >-
        새 버전은 GitHub Releases latest(`tag_name`)를 6시간에 한 번 본다 — 부를 때 받아 둔 값이 6시간 지났으면 다시 묻는다(3초 제한). 실패하면 `latest: null`(띠 없음)이고 그것도 6시간 둔다.
        `current`는 출시 이미지의 버전(`DDALKKAK_VERSION`)이다. 소스 빌드(compose · bootRun · dev 이미지)는 null이고 GitHub에 묻지 않는다.
        `latest`는 `current`보다 새 출시 버전일 때만 있다. `canUpdate`는 설치기(README `docker run` 한 줄)로 깐 서버일 때 true — 화면은 업데이트 버튼을 보인다.
        false(GHCR 이미지를 Compose로 띄움)면 버튼 대신 `docker compose pull && docker compose up -d` 안내를 보인다. 홈에 들어올 때 한 번 부른다
      x-owner: [B2]
      x-features: [F-HOME-06]
      x-week: 발표 뒤
      x-jira: [S15P31A107-221]
      responses:
        '200':
          description: 버전
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateStatus' }
              examples:
                newVersion: { summary: 설치기로 깐 1.2.1 · 새 버전 1.2.2 → 띠 + 업데이트 버튼, value: { current: '1.2.1', latest: '1.2.2', canUpdate: true } }
                compose: { summary: Compose로 띄운 출시 이미지 → 띠 + 명령 안내, value: { current: '1.2.1', latest: '1.2.2', canUpdate: false } }
                upToDate: { summary: 최신이거나 GitHub 확인 실패 → 띠 없음, value: { current: '1.2.2', latest: null, canUpdate: true } }
                source: { summary: 소스 빌드 → 띠 없음, value: { current: null, latest: null, canUpdate: false } }
        '401': { $ref: '#/components/responses/NotLoggedIn' }
    post:
      tags: [④ 화면]
      operationId: startUpdate
      summary: 1 홈 업데이트 버튼 — 새 버전 설치기를 띄운다
      description: >-
        지난 업데이트가 남긴 설치기를 `docker rm ddalkkak-update`로 지우고(도는 것은 `-f`가 없어 남는다) `docker run -d --name ddalkkak-update --pull missing -v /var/run/docker.sock:/var/run/docker.sock ghcr.io/mouse-ddalkkak/ddalkkak-server:<latest> update`를 띄운 뒤(새 이미지를 받는 데까지 기다린다, 최대 5분) 202를 준다.
        설치기는 `--rm` 없이 남는다 — 도중에 실패하면 `docker logs ddalkkak-update`로 이유를 본다.
        설치기 `update`(server/start.sh)가 지금 설치의 방식 · 포트 · 홈 폴더 · AI 허용 주소를 읽어 이 서버를 새 버전으로 바꾼다 — 1분쯤 서버가 응답하지 않다가 새 버전으로 뜬다.
        로그인 세션은 메모리라 다시 로그인한다(401 → 0-2). 비밀번호 · 검사 기록 · 포트 · 홈 폴더는 그대로다. 이미 누가 눌러 같은 이름 컨테이너가 돌고 있으면 그 업데이트가 이어지므로 202다.
        새 버전이 없거나(`latest: null`) 버튼을 쓸 수 없는 설치(`canUpdate: false`)면 409 `UPDATE_UNAVAILABLE`, 검사 중이면 다시 띄우면 검사가 끊겨 409 `RUN_IN_PROGRESS`, docker가 실패하면 502 `UPDATE_FAILED`
      x-owner: [B2]
      x-features: [F-HOME-06]
      x-week: 발표 뒤
      x-jira: [S15P31A107-221]
      responses:
        '202':
          description: 설치기를 띄움 — 1분쯤 뒤 새 버전
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version: { type: string, description: 올라갈 버전 }
              example: { version: '1.2.2' }
        '401': { $ref: '#/components/responses/NotLoggedIn' }
        '409':
          description: 새 버전이 없거나 버튼을 쓸 수 없는 설치 · 검사 중
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                unavailable: { value: { code: UPDATE_UNAVAILABLE, message: 업데이트할 새 버전이 없어요 } }
                running: { value: { code: RUN_IN_PROGRESS, message: 이미 검사 중이에요 } }
        '502':
          description: 설치기를 띄우지 못함 (이미지를 받지 못함 · docker 실패)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: UPDATE_FAILED, message: 업데이트를 시작하지 못했어요 · 설치 명령을 다시 실행해 주세요 }

