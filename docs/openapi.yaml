  /api/services/{id}/disconnect:
    parameters: [{ $ref: '#/components/parameters/ServiceId' }]
    post:
      tags: [④ 화면]
      operationId: disconnectService
      summary: 1 · 0-3 ② 연결 해제 (해제 안내 · 409 모달에서 사용자가 확인했을 때만)
      description: >-
        연결 점검이 3번 연속 실패하거나 생존 신호가 1분 30초 넘게 없으면(-250) 홈 · 0-3 ②가 해제 안내를 띄우고(안내 칸은 `GET /api/home`의 `service.disconnect`, B2 -234 약속), 사용자가 확인하면 부른다.
        0-3 ② 허용이 409이고 기존 서비스가 끊겼으면(`service.connected: false`) 409 모달의 "기존 연결 해제"로도 부른다 — 끈 앱 자리(같은 포트)에 다른 앱을 띄우면 점검이 성공해, 생존 신호가 끊긴 지 1분 30초가 지나기 전이거나 딸깍이 다시 켜져 그 서비스의 신호를 아직 못 받았으면 해제 안내가 안 뜨기 때문이다(-250). 해제 뒤 화면은 같은 요청을 다시 허용한다.
        딸깍은 스스로 해제하지 않는다. 그 서비스에 검사 중(running) 회차가 있으면 409 `RUN_IN_PROGRESS`로 거절한다 — 검사는 단계마다 포트를 지금 연결된 서비스에서 읽어서, 해제하면 남은 단계가 터지거나 같은 포트에 새로 연결한 다른 앱을 검사한다. 화면은 "검사가 끝나거나 중단한 뒤 해제할 수 있어요"로 알린다.
        service 줄은 남기고(지난 회차 · 결과는 지우지 않는다. 결과 `service`는 그 회차의 서비스 이름이다. 8 이력 · 홈 지난 검사는 지금 연결된 서비스의 회차만이라 해제 뒤엔 비고, 같은 앱을 다시 허용하면 그 줄을 다시 써서 다시 보인다) 해제 시각을 적고 토큰 해시를 지운다. 생존 신호 · 점검 실패 수 · 그 서비스의 허용된 연결 요청(메모리, 아직 앱에 못 건넨 토큰) · 할 일 큐도 지운다 — 요청을 남기면 허용 직후 해제한 앱이 다음 신호에서 401 대신 토큰을 다시 받는다.
        그 뒤 `GET /api/home`의 `service`는 null이고, 앱의 다음 생존 신호는 401이라 스타터킷은 토큰을 지우고 연결 요청부터 다시 한다(-211).
        화면은 0-3 ②로 가서 다른 서비스를 고를 수 있다
      x-owner: [B2]
      x-features: [F-CONN-09]
      x-week: 3주
      x-jira: [S15P31A107-223]
      responses:
        '204': { description: 해제함 }
        '401': { $ref: '#/components/responses/NotLoggedIn' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RunInProgress' }

