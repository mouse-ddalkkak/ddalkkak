  /api/runs/{id}/events:
    parameters: [{ $ref: '#/components/parameters/RunId' }]
    get:
      tags: [④ 화면]
      operationId: runEvents
      summary: 5 진행 실시간 (SSE)
      description: |
        이벤트 4종(progress · log · error · done). 연결이 끊기면 `GET /api/runs/{id}/progress`로 지금 상태를 받고 다시 붙는다.
        ```
        event: progress
        data: {"pct":42,"leftMin":13,"step":"perf","item":"perf-2"}
        ```
        이벤트마다 `data` 한 줄 JSON, 4종의 예시는 아래 examples(이름 = event). 단계 트리(완료 · 건너뜀 사유)는 이벤트에 없으니 화면 5에 들어올 때와 progress 이벤트의 `step`·`item`이 바뀔 때 `GET /api/runs/{id}/progress`로 받는다. `error`는 도구가 도는 동안 딸깍이 따로 부른 그 시나리오 API가 30초 넘게 응답 없기를 3번 연속하면(`text: 서버가 응답을 멈췄어요`), 또는 도구가 돌지 못해(도구 받기 실패 · 도구 오류) 자동으로 한 번 더 돌려도 또 실패하면(`text: 검사 도구가 실패했어요 · 도구 오류`, -228) 보낸다 — 도구 컨테이너를 멈추고 retry · finish-partial · stop 중 고를 때까지 기다린다(scan.md §8). 기다리는 동안 다시 붙으면 progress 뒤에 그 error를 다시 받는다. `done`은 결과 저장이 끝난 뒤(B2).
      x-owner: [B3]
      x-features: [F-RUN-10, F-STOP-02, F-STOP-04]
      x-week: 1주 화면(가짜 이벤트) / 2주 연결 / 3주 error
      x-jira: [S15P31A107-131, S15P31A107-134, S15P31A107-143, S15P31A107-228]
      responses:
        '200':
          description: 이벤트 스트림. data 모양은 아래 schema
          content:
            text/event-stream:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ProgressEvent'
                  - $ref: '#/components/schemas/LogLine'
                  - $ref: '#/components/schemas/StopEvent'
                  - $ref: '#/components/schemas/DoneEvent'
              examples:
                progress: { value: { pct: 42, leftMin: 13, step: perf, item: perf-2 } }
                log: { value: { ts: '2026-11-07T14:40:31+09:00', tag: k6, text: 'vus=120 · http_req_duration p(95)=2.1s' } }
                error:
                  value:
                    step: perf
                    item: perf-2
                    title: 주문 상세 피크
                    ts: '2026-11-07T14:41:08+09:00'
                    text: 서버가 응답을 멈췄어요
                    lines:
                      - '14:40:38 [k6] GET /api/orders/{id} 30s 초과 (1/3)'
                      - '14:40:53 [k6] GET /api/orders/{id} 30s 초과 (2/3)'
                      - '14:41:08 [k6] GET /api/orders/{id} 30s 초과 (3/3) · 도구 일시정지'
                done: { value: { status: done } }
        '401': { $ref: '#/components/responses/NotLoggedIn' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/runs/{id}/progress:
    parameters: [{ $ref: '#/components/parameters/RunId' }]
    get:
      tags: [④ 화면]
