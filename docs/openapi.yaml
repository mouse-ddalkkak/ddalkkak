    parameters: [{ $ref: '#/components/parameters/RunId' }]
    post:
      tags: [④ 화면]
      operationId: retryRun
      summary: 5 오류 팝업 "다시 시도" — 멈춘 · 실패한 항목부터
      description: SSE `error`로 기다리는 회차만 받는다(서버 응답 멈춤 · 도구 실패 -228). 그 시나리오의 결과를 지우고 처음부터 다시 돈 뒤 남은 시나리오를 잇는다. 또 멈추거나 실패하면 `error`가 다시 온다(도구 실패의 자동 한 번 더는 회차마다 시나리오당 한 번이라 다시 시도 뒤에는 바로 `error`). 응답은 지금 회차 상태(running). 기다리는 회차가 아니면 404
      x-owner: [B3]
      x-features: [F-STOP-03, F-STOP-04]
      x-week: 3주
      x-jira: [S15P31A107-143, S15P31A107-228]
      responses:
