  # ───────────────────────── ④ 홈 도구 상태 ─────────────────────────
  /api/tools:
    get:
      tags: [④ 화면]
      operationId: getTools
      summary: 1 홈 "도구 상태" 팝업 — k6 · ZAP · Semgrep 설치 · 실행 가능 · 최근 오류
      description: >-
        도구마다 설치 여부(`docker image ls -q <이미지>`, 부를 때마다 — 0 · 빈 출력이면 없음, 0이 아니면 docker에 못 붙음. DockerTool과 같은 확인) ·
        실행 가능 여부(이미지가 있을 때만 도구별 버전 명령 `docker run --rm <이미지> <명령>`, 10분 캐시) · 최근 오류를 돌려준다.
        버전 명령은 k6 `version`(이미지 ENTRYPOINT가 k6) · zap `zap.sh -cmd -version` · semgrep `semgrep --version`이다 — ZAP · Semgrep 이미지는
        ENTRYPOINT가 없어 `--version`만 주면 그것을 명령으로 실행해 127로 끝난다. 이미지는 받지 않는다(받기는 검사 때 DockerTool, scan.md §2).
        `state`: `docker_unavailable`(docker에 붙지 못함 — `docker image ls`가 0이 아님. 이미지가 있는지 알 수 없다) · `not_installed`(이미지 없음 — 첫 검사에서 받는다) ·
        `not_runnable`(이미지는 있는데 시험 실행 실패) · `recent_error`(`lastError`가 있음) · `ok`. 지금 상태가 먼저다 — docker_unavailable · not_installed · not_runnable이면 그 순서로 그 값이고, 설치 · 실행이 되면
        최근 오류가 있을 때 recent_error, 없으면 ok. 받기 실패 뒤 아직 이미지가 없으면 not_installed에 `lastError`(stage pull)가 같이 온다.
        `lastError`는 그 도구를 실제로 띄운 가장 최근 회차(그 도구 줄이 `done` · `partial`이거나 사유가 `도구 받기 실패` · `도구 오류` · `결과 해석 실패` ·
        `요청 구성 오류`인 회차. 단 ZAP의 `요청 구성 오류`는 띄우기 전 확인 요청에서 나니 세지 않는다)에서 사유가 `도구 받기 실패`(`stage: pull`) · `도구 오류`(`stage: run`)인 `raw_result` 줄 중 마지막으로 채운다.
        그 회차에 그런 줄이 없으면 null(다음 회차가 도구를 돌려 오류 없이 끝나면 사라진다). 시작할 때 앱이 끊겨 도구를 띄우지 않았거나(`앱 연결 끊김`)
        띄우기 전에 멈춘(`중단됨`) 회차는 회차로 세지 않아, 앞 회차의 도구 오류를 가리지 않는다(!138 리뷰 1-1).
        관리자 점검이 붙어 건너뛴 ZAP 줄이 `partial`로 바뀐 경우(권한 점검 카드가 없을 때, scan.md §6)는 근거 줄 `[zap] <itemKey> → 건너뜀(<사유>)`의
        원래 사유로 센다 — `계정 없음`이면 띄운 회차가 아니고 `도구 오류`면 최근 오류다. 이때 `cause`는 뒤에 붙은 `== <itemKey> · 권한 점검` 구간이 아니라
        ZAP 구간에서 읽는다(!138 리뷰 2-1). 마지막 줄 하나만 보지 않는 까닭은 docker를 부르지
        않고 건너뛴 줄(`부하를 주기 어려운 메서드` · `계정 없음` · `대상 없음`)도 같은 `tool`로 남아 앞 줄의 도구 오류를 가리기 때문이다.
        `cause`는 그 줄 원본 로그(`log_path`)에서 그 시나리오 구간 — `== <item_key>` 머리줄부터 다음 `== ` 줄 앞까지 — 의 끝 몇 줄이다(토큰 · 비밀번호는 `****`).
        원본 로그는 회차마다 도구별 한 파일이라 같은 도구의 다른 시나리오도 이어 쓰므로, 파일 끝을 읽으면 다른 시나리오의 출력이 나온다.
        Semgrep은 시나리오를 한 번에 돌려 머리줄이 `== code-1,code-2 · exit=…`처럼 키를 여럿 담는다. `fix`는 화면에 그대로 보이는 조치 문구다.
        목록에는 딸깍이 구성한 도구만 있다(지금은 k6 · zap · semgrep 셋 다 늘 구성). docker에 붙지 못하면 세 도구 모두 `state: docker_unavailable` · `installed: false` · `runnable: false`이고 `fix`가 Docker를 켜라고 안내한다(이미지가 받아져 있어도 미설치로 보이지 않게)
      x-owner: [B3]
      x-features: [F-HOME-01, F-RUN-04, F-RUN-05, F-RUN-07]
      x-week: 4주
      x-jira: [S15P31A107-229, S15P31A107-244]
      responses:
        '200':
          description: 도구별 상태 (k6 · zap · semgrep 순서)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ToolList' }
              examples:
                ok:
                  summary: 셋 다 실행 가능
                  value:
                    tools:
                      - { name: k6, image: 'grafana/k6:1.8.1', state: ok, installed: true, runnable: true, checkedAt: '2026-11-11T10:00:00+09:00', lastError: null, fix: null }
                      - { name: zap, image: 'zaproxy/zap-stable:2.16.1', state: ok, installed: true, runnable: true, checkedAt: '2026-11-11T10:00:00+09:00', lastError: null, fix: null }
                      - { name: semgrep, image: 'semgrep/semgrep:1.180.0', state: ok, installed: true, runnable: true, checkedAt: '2026-11-11T10:00:00+09:00', lastError: null, fix: null }
                notInstalled:
                  summary: 첫 검사 전 — 이미지가 아직 없음
                  value:
