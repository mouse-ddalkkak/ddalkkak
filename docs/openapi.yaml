openapi: 3.1.0
info:
  title: 딸깍 API
  version: 0.1.0-draft
  description: |
    딸깍의 HTTP 약속 전부. **약속 상태** — ① ② ③ ④ 확정 (③은 S15P31A107-114). 요약·확정 담당은 [api.md](api.md).

    | 약속 | 경로 | 부르는 쪽 → 답하는 쪽 |
    | --- | --- | --- |
    | ① 연결 · API 목록 · 측정값 | `/starter/v1/*` | 스타터킷 → Spring(받는 쪽 B2 · 스타터킷 B1) |
    | ② 시나리오 | `/ai/check` `/ai/scenarios` | Spring(B2) → AI 서버(AI1) |
    | ③ 결과 원본 → 점수·설명 | `/ai/reports` `/ai/prompts` | Spring(B2, 본문은 B3) → AI 서버(AI2) |
    | ④ 화면에 필요한 데이터 | `/api/*` | 화면(B4) → Spring |

    **공통 규칙**
    - 화면은 `/api/*`만, `/starter/*`는 스타터킷만, `/ai/*`는 Spring만 부른다
    - JSON은 camelCase. 시각은 ISO-8601(`+09:00`). 비율은 0–1 숫자
    - 단위는 이름 끝에 붙인다: `Ms` `Sec` `Min` `Mb` `Gb`
    - 경로의 `{id}`는 전부 **runId**다. `POST /api/runs/prepare`가 회차(run)를 만들고, 준비 → 범위 → 실행 → 결과가 같은 id를 쓴다
    - 오류 응답은 전부 `{ "code": "RUN_IN_PROGRESS", "message": "이미 검사 중이에요" }`. `message`는 화면에 그대로 보여 줄 쉬운 말
    - 세션 쿠키(HttpOnly). 0-1·0-2(`/api/setup*`, `/api/auth/login`) 외 `/api/*`는 로그인이 필요하다

    **타임아웃** — 안쪽이 바깥보다 짧아야 AI 서버가 기본값으로 바꿔 답할 수 있다
    - `/ai/check`: AI 서버 안 시험 호출 10초 / Spring 15초
    - `/ai/scenarios` `/ai/reports`: AI 서버 안 LLM 60초 → 넘으면 기본 시나리오·기본 설명 / Spring 70초
    - `/ai/prompts`: AI 서버 안 LLM 30초 → 넘으면 기본 틀 / Spring 40초

    **x- 필드** — 담당·기능·주차·Jira를 한곳에서 대조하려고 붙인다
    - `x-owner` 만드는 역할(B1 · B2 · B3 · B4 · AI1 · AI2)
    - `x-features` [기능명세서](functional-spec.md) ID · `x-week` 화면에서 보이는 주차 · `x-jira` 스토리
servers:
  - url: http://localhost:7777
    description: Spring 서버 (① ④)
security:
  - session: []
tags:
  - name: ① 스타터킷
    description: '**[확정]** 연결 · API 목록 · 측정값. 스타터킷이 먼저 보내고 딸깍은 앱에 먼저 연락하지 않는다. 딸깍이 할 일은 생존 신호 응답의 `commands`에 싣는다. 예시는 `contracts/1-starter/` (`python scripts/screen_contracts.py`로 이 파일에서 뽑는다)'
  - name: ② 시나리오
    description: AI 서버(FastAPI)는 아무것도 저장하지 않는다. 키·주소·모델은 매 요청 헤더로 받고, 헤더가 없으면 기본 시나리오를 돌려준다
  - name: ③ 결과·점수
    description: 요청(검사 결과 원본) 모양은 B3, 응답(점수·설명)은 AI2. 점수는 규칙으로 계산하고 LLM은 설명·요청문만 쓴다. 원본에 없는 숫자는 설명에 쓰지 못한다
  - name: ④ 화면
    description: '**[확정]** 화면(B4)이 부르는 REST. 긴 작업은 "시작 → id → 진행 조회(또는 SSE)"로 통일. 화면별 예시는 `contracts/4-screen/` (`python scripts/screen_contracts.py`로 이 파일에서 뽑는다)'

paths:
  # ───────────────────────── ① 스타터킷 ─────────────────────────
  /starter/v1/hello:
    post:
      tags: [① 스타터킷]
      operationId: starterHello
      summary: 연결 요청 — 앱이 켜질 때
      description: 키·설정 파일 없이 같은 서버의 딸깍(:7777)을 찾아 보낸다. 실제 데이터 값은 보내지 않는다. 딸깍이 꺼져 있으면 30초마다 다시 시도하고 고객 앱 동작은 막지 않는다. 허용 전까지 요청은 딸깍 메모리에만 있다. 전에 받아 저장해 둔 토큰이 있으면 `X-Ddalkkak-Token`에 싣는다 — 그 서비스 토큰이 맞을 때만 approved, 없거나 틀리면 이름·host·port가 같아도 pending(사람이 다시 허용)
      security: []
      x-owner: [B2]
      x-features: [F-CONN-02, F-CODE-05]
      x-week: 1주
      x-jira: [S15P31A107-118, S15P31A107-147, S15P31A107-181, S15P31A107-211, S15P31A107-224]
      parameters:
        - $ref: '#/components/parameters/StarterTokenOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HelloRequest' }
      responses:
        '200':
          description: 대기 중인 연결 요청이 생김 (허용된 앱이 맞는 토큰을 실어 다시 켜지면 approved + serviceId)
          content:
            application/json:
              schema:
                type: object
                required: [requestId, status, serviceId]
                properties:
                  requestId: { type: string }
                  status: { type: string, enum: [pending, approved] }
                  serviceId: { type: [string, 'null'], description: approved일 때만 값 }
                example: { requestId: req_7f2a, status: pending, serviceId: null }
              examples:
                approved: { summary: 허용된 앱이 저장한 토큰을 실어 다시 켜짐, value: { requestId: req_8b31, status: approved, serviceId: svc_1 } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /starter/v1/heartbeat:
    post:
      tags: [① 스타터킷]
      operationId: starterHeartbeat
      summary: 생존 신호 — 10초마다
      description: |
        딸깍은 저장하지 않고 최신 값만 메모리에 둔다(`cpu`만 성능 측정 근거로 최근 1시간, -248). 30초 동안 신호가 없으면 서비스 "연결 끊김". 응답의 `commands`로 할 일(API 목록 보내기 · 측정 시작/끝)을 전한다. `SEND_APIS`를 받고 20초 안에 목록이 안 오면 **같은 `snapshotId`로** 1번 더 싣는다. 스타터킷은 `/apis` 전송이 성공(2xx)한 `snapshotId`만 끝난 것으로 보고, 끝난 것이 다시 오면 무시한다.
        딸깍이 다시 켜져 메모리의 연결 요청을 잃었으면 모르는 `requestId`라 404 → 스타터킷은 hello부터 다시 보낸다. 허용된 서비스는 `serviceId`가 DB에 있어 404가 나지 않는다.
        **토큰** (-211): 허용되면 다음 응답에 `token`이 한 번 실린다(그 토큰을 실은 신호가 올 때까지는 매번). 스타터킷은 그것을 저장하고 이후 모든 ① 호출의 `X-Ddalkkak-Token`에 싣는다. 허용된 서비스로 오는 신호는 토큰이 맞아야 하고, 틀리면 401 → 스타터킷은 토큰을 지우고 hello부터(사람이 다시 허용). 대기 · 무시 요청은 `requestId`만으로 받는다
      security: []
      x-owner: [B2]
      x-features: [F-CONN-06, F-API-02, F-RUN-02]
      x-week: 1주 (MEASURE 명령 2주)
      x-jira: [S15P31A107-118, S15P31A107-126, S15P31A107-135, S15P31A107-181, S15P31A107-211]
      parameters:
        - $ref: '#/components/parameters/StarterTokenOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HeartbeatRequest' }
            examples:
              pending: { summary: 허용 전, value: { requestId: req_7f2a, serviceId: null, cpu: 0.21, mem: { usedMb: 4980, totalMb: 8192 }, disk: { usedGb: 38, totalGb: 80 }, uptimeSec: 40 } }
      responses:
        '200':
          description: 연결 상태와 할 일
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HeartbeatResponse' }
              examples:
                pending: { summary: 허용 기다리는 중, value: { status: pending, serviceId: null, commands: [] } }
                approvedToken: { summary: 막 허용됨 · 토큰 한 번 (토큰 없이 requestId로 온 신호), value: { status: approved, serviceId: svc_1, commands: [], token: example-starter-token-not-real } }
                sendApis: { summary: 허용됨 · API 목록 요청, value: { status: approved, serviceId: svc_1, commands: [{ type: SEND_APIS, snapshotId: snap_12 }] } }
                measureStop: { summary: 검사 끝 · 측정 끝, value: { status: approved, serviceId: svc_1, commands: [{ type: MEASURE_STOP, runId: run_5 }] } }
                ignored: { summary: 사용자가 "아니에요" → 같은 요청으로 신호를 계속 보낸다 · "다시 찾기"가 되살리면 다시 pending (-251), value: { status: ignored, serviceId: null, commands: [] } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/StarterTokenInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }

  /starter/v1/apis:
    post:
      tags: [① 스타터킷]
      operationId: starterApis
      summary: API 목록 보내기 — SEND_APIS를 받았을 때
      description: API마다 모양만 보낸다(실제 값 없음). B2가 api_snapshot·api_endpoint에 저장하고 지난번과 메서드+주소 기준으로 비교한다. 같은 `snapshotId`가 다시 오면(재전송) 다시 저장하지 않고 처음 결과를 그대로 돌려준다. 모르는 `serviceId`면 404, 토큰이 그 서비스 것이 아니면 401(저장하지 않는다)
      security: []
      x-owner: [B2]
      x-features: [F-API-03, F-API-04]
      x-week: 1주
      x-jira: [S15P31A107-126, S15P31A107-181, S15P31A107-211, S15P31A107-240]
      parameters:
        - $ref: '#/components/parameters/StarterToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serviceId, snapshotId, apis]
              properties:
                serviceId: { type: string }
                snapshotId: { type: string, description: SEND_APIS 명령에 실려 온 값 그대로 }
                apis:
                  type: array
                  items: { $ref: '#/components/schemas/ApiEndpoint' }
            example:
              serviceId: svc_1
              snapshotId: snap_12
              apis:
                - method: GET
                  path: '/api/orders/{id}'
                  params: [{ name: id, in: path, type: integer, required: true }]
                  auth: { required: true, role: USER }
                  handler: 'OrderController#get'
                  calls: 1820
                - method: GET
                  path: /api/orders
                  params: [{ name: page, in: query, type: integer, required: false }, { name: status, in: query, type: string, required: false }]
                  auth: { required: true, role: USER }
                  handler: 'OrderController#list'
                  calls: 5310
                - method: POST
                  path: /api/orders
                  params: [{ name: body, in: body, type: object, required: true }]
                  auth: { required: true, role: USER }
                  handler: 'OrderController#create'
                  calls: 412
                - method: GET
                  path: /api/products
                  params: []
                  auth: { required: false, role: null }
                  handler: 'ProductController#list'
                  calls: 9021
      responses:
        '200':
          description: 저장 결과와 지난번 대비 변화 (첫 목록이면 added = count)
          content:
            application/json:
              schema:
                type: object
                required: [count, added, removed, changed]
                properties:
                  count: { type: integer }
                  added: { type: integer }
                  removed: { type: integer }
                  changed: { type: integer }
              example: { count: 14, added: 1, removed: 0, changed: 0 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/StarterTokenInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }

  /starter/v1/measures:
    post:
      tags: [① 스타터킷]
      operationId: starterMeasures
      summary: 앱 안쪽 측정값 — 측정 중 1초마다
      description: 바깥 도구로는 알 수 없는 값. MEASURE_START ~ MEASURE_STOP 사이 `intervalSec`마다 보낸다. 한 번에 그 1초의 API별 샘플을 담는다(그 1초에 요청이 없던 API는 뺀다). B2가 받아 B3 콜백(`Measurements`)으로 넘기고 B3가 measure_sample에 저장한다. 모르는 `serviceId`면 404, 토큰이 그 서비스 것이 아니면 401(넘기지 않는다)
      security: []
      x-owner: [B2]
      x-features: [F-RUN-08]
      x-week: 2주
      x-jira: [S15P31A107-135, S15P31A107-181, S15P31A107-211]
      parameters:
        - $ref: '#/components/parameters/StarterToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serviceId, runId, samples]
              properties:
                serviceId: { type: string }
                runId: { type: string, description: MEASURE_START 명령에 실려 온 값 그대로 }
                samples:
                  type: array
                  items: { $ref: '#/components/schemas/MeasureSample' }
              example:
                serviceId: svc_1
                runId: run_5
                samples:
                  - ts: '2026-11-07T14:39:01+09:00'
                    api: GET /api/orders
                    requests: 52
                    dbQueriesPerRequest: 1240
                    dbWaitMs: 38
                    pool: { active: 20, max: 20, waiting: 148 }
                  - ts: '2026-11-07T14:39:01+09:00'
                    api: 'GET /api/orders/{id}'
                    requests: 31
                    dbQueriesPerRequest: 3
                    dbWaitMs: 12
                    pool: { active: 20, max: 20, waiting: 148 }
            examples:
              unmeasured:
                summary: DataSource를 감싸지 못함 · HikariCP 아님 → DB 값 · 풀 미측정
                value:
                  serviceId: svc_1
                  runId: run_5
                  samples:
                    - { ts: '2026-11-07T14:39:01+09:00', api: GET /api/orders, requests: 52, dbQueriesPerRequest: null, dbWaitMs: null, pool: null }
      responses:
        '204':
          description: 받음
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/StarterTokenInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── ② 시나리오 ─────────────────────────
  /ai/check:
    servers: [{ url: 'http://127.0.0.1:8000', description: AI 서버 (같은 서버 127.0.0.1에만 열림) }]
    post:
      tags: [② 시나리오]
      operationId: aiCheck
      summary: AI 키로 부를 수 있는지 확인
      description: |
        아주 짧은 시험 호출. 본문은 없고 키·주소·모델은 헤더 4개(`X-AI-Provider` `X-AI-Base-Url` `X-AI-Key` `X-AI-Model`)로 받는다. 키는 저장하지 않는다
        - 실패해도 200이고 `ok: false` + 이유를 `message`에 쉬운 말로 담는다. 400은 요청 자체가 깨졌을 때만
        - 시험 호출은 AI 서버 안에서 10초까지 기다린다. 넘으면 `ok: false`로 답한다(Spring 15초보다 짧아야 한다)
        - `X-AI-Key`가 없거나 비어 있으면 시험 호출 없이 `ok: false`("AI 키를 먼저 입력해 주세요")
        - 내부 주소로 나가는 호출은 막는다: 메타데이터 · 링크 로컬 · 사용자 정보(`user:pass@`)가 든 주소는 항상, 루프백 · 내부 서비스 이름은 기본으로(운영자가 `AI_ALLOWED_HOSTS`로 열면 허용). 시험 호출 없이 `ok: false` + "이 주소는 쓸 수 없어요 · 주소를 확인해 주세요" 한 가지 문구로 답한다(사유를 가르지 않는다). 리다이렉트는 따라가지 않는다. `/ai/scenarios` 등 다른 `/ai/*`도 같은 검사를 거치고 막히면 기본값으로 답한다
      security: []
      x-owner: [AI1]
      x-features: [F-AI-02]
      x-week: 1주
      x-jira: [S15P31A107-122]
      parameters:
        - $ref: '#/components/parameters/AiProvider'
        - $ref: '#/components/parameters/AiBaseUrl'
        - $ref: '#/components/parameters/AiKey'
        - $ref: '#/components/parameters/AiModel'
      responses:
        '200':
          description: 확인 결과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiCheckResult' }
              examples:
                ok: { summary: 연결됨, value: { ok: true, shown: Claude · 기본 모델, message: 연결됐어요 } }
                short: { summary: 키가 너무 짧음, value: { ok: false, shown: null, message: 키가 너무 짧아요 · 다시 확인해 주세요 } }
                rejected: { summary: 인증 실패, value: { ok: false, shown: null, message: 키가 맞지 않아요 } }
                timeout: { summary: 시험 호출 10초 넘음, value: { ok: false, shown: null, message: AI가 응답하지 않아요 } }
                noKey: { summary: 키 헤더 없음 또는 빈 키, value: { ok: false, shown: null, message: AI 키를 먼저 입력해 주세요 } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /ai/scenarios:
    servers: [{ url: 'http://127.0.0.1:8000', description: AI 서버 (같은 서버 127.0.0.1에만 열림) }]
    post:
      tags: [② 시나리오]
      operationId: aiScenarios
      summary: 시나리오 만들기
      description: |
        - 키 헤더가 없거나 LLM이 60초를 넘기거나 형식이 틀리면 규칙으로 만든 기본 시나리오(`source: default`). 기본이 된 이유는 선택 필드 `fallback`(`no-key` · `timeout` · `llm-error` · `format` · `all-filtered` · `recheck`)이 알린다 — 화면에 보이지 않고 Spring은 읽지 않아도 되며(하위 호환), 호출 실패 종류는 `llm-error` 하나로 묶어 키 상태를 드러내지 않는다. 원인은 AI 서버 로그로 본다. 성능 = 호출 많은 GET 상위 3개 50→200명·3분·점진 / 보안 = 테스트 계정 · 호출 많은 `{id}` GET 하나의 권한 점검(남의 데이터 보기, AI 없이도 · 재검사도, -231) · 기본 공격 범위 / 코드 품질 = 주요까지
        - 키가 있는 첫 검사(`mode: full`)는 성능 · 보안 · 코드 품질 항목을 LLM이 만든다(성능 호출과 보안·코드 호출을 동시에). 한쪽이 실패하면 그 영역만 기본 항목이다. 성능 3~5개 · 보안 3~6개(경로 변수가 끝에 하나뿐인 `{id}` GET(로그인이 필요한 것 먼저, 호출 많은 순)은 남의 데이터 보기 항목을 보장, 로그인이 필요한 API를 대상으로 하면 테스트 계정 항목 보장) · 코드 최대 3개
        - API가 80개를 넘으면 프롬프트에는 호출 많은 상위 80개만 넣는다(받는 값 10개 · 경로 200자). 목록 밖 주소 거르기는 전체 API로 한다. 항목 개수를 자를 때는 호출 많은 순으로 남기고 제외(`excluded`) 항목은 성능 · 코드의 개수에 세지 않는다(제외는 최대 3개만 보인다). 자른 항목은 응답에 없다
        - 받은 목록에 없는 주소는 빼고 `filtered[]`에 사유를 남긴다. 성능(k6) 항목은 GET만 받고 쓰기 · 삭제 메서드면 `filtered[]` 사유 `부하를 주기 어려운 메서드`로 뺀다. LLM이 보낸 항목은 정해진 칸만 남기고(`source` 등은 버림) `reused`는 false로 둔다. `mode: changed`는 LLM을 부르지 않아 `previous` 항목을 거르지 않고 그대로 돌려주니, 쓰기 API 성능 항목의 마지막 방어는 k6 실행 쪽이다. 숫자는 범위 안으로 고친다(사용자 10–2000, 1–30분)
        - `mode: changed`(재검사)면 `apis`에는 바뀐 API(새로 생김·바뀜)만, `previous`에는 지난 항목이 온다. 바뀐 API 항목만 새로 만들고, 그대로 쓴 항목은 `previous` 그대로 `reused: true`로 돌려준다. 없어진 API의 항목은 AI 서버가 알 수 없으니 Spring이 `previous`에서 빼고 보낸다. `hasCode: true`이고 `previous`에 코드 품질 항목이 없으면 코드 품질 시나리오를 새로 만든다(`hasCode: false`면 지난 코드 품질 항목을 뺀다). Spring은 바뀐 API가 없어도 코드를 새로 연결했거나 끊었으면, 또는 코드가 있는데 지난 항목에 코드 품질이 없으면 `apis: []`로 부른다. `previous`에 권한 점검이 없고 바뀐 API에 로그인 필요 `{id}` GET이 없으면 바뀌지 않은 로그인 필요 `{id}` GET 하나를 `apis`에 더 실어 부르고, 그 API를 대상으로 한 응답 카드는 권한 점검만 쓴다(S15P31A107-238, docs/ai-server.md §2-4). 그 밖에 바뀐 게 없으면 아예 부르지 않는다
        - `previous`의 모양이 틀리면(항목에 `key` · `area` · `tool`이 없는 등) 400이 아니라 받은 `apis`로 전체 새로 계획한다(`source: default` · 모두 `reused: false`)
        - `hasCode: false`면 코드 품질 항목을 만들지 않는다
        - **`tool: ddalkkak`은 하나로 확정한다**(S15P31A107-170, 선택지 A): `params.count`가 있으면 **테스트 계정 만들기**, `params.idCount`가 있으면 **권한 점검**(남의 데이터 보기 — 주소의 id만 바꿔 조회해 보는 항목. 관리자 주소 `/admin` 류의 비로그인 접근은 AI 프롬프트에서 `zap`이 맡고, `idCount` 항목이 보는 범위는 docs/scan.md §6을 따른다. 딸깍은 관리자 비로그인 점검을 첫 `idCount` 항목에, 없으면 `/admin`이 든 첫 `zap` 항목 결과에 싣는다). `tool` 값을 `account` · `authz` 등으로 나누지 않으며 한 항목은 둘 중 하나만 가진다. 받는 쪽(B2 `scenario_item.tool` 저장 · `ScopeParams` 검사, B3 실행)은 `params`의 `count` · `idCount` 유무로 구분한다(B2 B2 확인 11/2)
        - 로그인이 필요한 API(`auth.required`)를 대상으로 한 항목이 있으면 테스트 계정 항목(`tool: ddalkkak` · `params.count`)을 함께 넣는다. 없으면 그 항목은 "계정 없음"으로 건너뛴다
        - `counts`는 `items`의 영역별 개수다(AI가 뺀 `excluded` 항목도 센다)
        - 요청이 깨졌으면 400. 그 밖의 문제(LLM 실패 · 60초 초과 · 형식 틀림 · 전부 걸러짐)는 오류로 내지 않고 기본 시나리오로 200
        - 예시는 요청 `full` → 응답 `llm`(키 있음) · `default`(키 헤더 없음), 요청 `changed` → 응답 `changed`, 요청 `noCode` → 응답 `noCode`가 짝이다
        - 항목 `params`와 범위: 성능(k6) `usersFrom` `usersTo` 10–2000 · `durationMin` 1–30 · `shape` constant·ramp·spike·step · `failP95Ms`(기본 500) · `failErrorRate`(기본 0.01) / 보안(zap) `range` default·wide·full / `tool: ddalkkak`은 `params.count`가 있으면 테스트 계정 만들기, `idCount`가 있으면 권한 점검 — 권한 점검 `idCount` / 테스트 계정 `count` 1–5 / 코드 품질(semgrep) `severity` critical·major·all
      security: []
      x-owner: [AI1]
      x-features: [F-PLAN-01, F-PLAN-02, F-PLAN-03, F-PLAN-04]
      x-week: 1주 기본 시나리오·성능 / 2주 보안·코드·재검사
      x-jira: [S15P31A107-122, S15P31A107-132, S15P31A107-140, S15P31A107-149]
      parameters:
        - $ref: '#/components/parameters/AiProvider'
        - $ref: '#/components/parameters/AiBaseUrl'
        - $ref: '#/components/parameters/AiKey'
        - $ref: '#/components/parameters/AiModel'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service, hasCode, mode, apis]
              properties:
                service: { $ref: '#/components/schemas/ServiceRef' }
                hasCode: { type: boolean }
                mode: { type: string, enum: [full, changed] }
                apis:
                  type: array
                  items: { $ref: '#/components/schemas/ApiEndpoint' }
                previous:
                  description: mode가 changed일 때만
                  type: array
                  items: { $ref: '#/components/schemas/ScenarioItem' }
            examples:
              full:
                summary: 첫 검사 — 코드 연결됨 · API 목록 전체
                value:
                  service: { name: order-api, framework: Spring Boot 3.2 }
                  hasCode: true
                  mode: full
                  apis:
                    - { method: GET, path: /api/orders, params: [{ name: q, in: query, type: string, required: false }], auth: { required: true, role: USER }, handler: 'OrderController#list', calls: 1820 }
                    - { method: GET, path: /api/products, params: [], auth: { required: false, role: null }, handler: 'ProductController#list', calls: 960 }
                    - { method: GET, path: '/api/orders/{id}', params: [{ name: id, in: path, type: integer, required: true }], auth: { required: true, role: USER }, handler: 'OrderController#get', calls: 310 }
                    - { method: POST, path: /api/orders, params: [{ name: body, in: body, type: object, required: true }], auth: { required: true, role: USER }, handler: 'OrderController#create', calls: 120 }
              changed:
                summary: 재검사 — 바뀐 API만 + 지난 항목
                value:
                  service: { name: order-api, framework: Spring Boot 3.2 }
                  hasCode: true
                  mode: changed
                  apis:
                    - { method: GET, path: /api/orders, params: [{ name: q, in: query, type: string, required: false }, { name: page, in: query, type: integer, required: false }], auth: { required: true, role: USER }, handler: 'OrderController#list', calls: 2150 }
                  previous:
                    - { key: perf-1, area: perf, tool: k6, title: 주문 목록 피크, api: GET /api/orders, why: '가장 많이 호출되는 API · 1,820번', params: { usersFrom: 50, usersTo: 200, durationMin: 3, shape: ramp, failP95Ms: 500, failErrorRate: 0.01 }, recommended: true, excluded: false, reused: false }
                    - { key: perf-3, area: perf, tool: k6, title: 주문 상세 피크, api: 'GET /api/orders/{id}', why: 세 번째로 많이 호출돼요, params: { usersFrom: 50, usersTo: 200, durationMin: 3, shape: ramp, failP95Ms: 500, failErrorRate: 0.01 }, recommended: true, excluded: false, reused: false }
                    - { key: sec-1, area: sec, tool: ddalkkak, title: 테스트 계정 만들기, why: 로그인이 필요한 검사에 쓸 계정이에요, params: { count: 2 }, recommended: true, excluded: false, reused: false }
                    - { key: sec-2, area: sec, tool: zap, title: 입력값 인젝션, api: GET /api/orders, why: 검색어가 쿼리에 들어가는 API예요, params: { range: default }, recommended: true, excluded: false, reused: false }
                    - { key: code-1, area: code, tool: semgrep, title: 예외 처리, target: 전체, why: 빈 catch가 장애를 숨겨요, params: { severity: major }, recommended: true, excluded: false, reused: false }
              noCode:
                summary: 코드 연결 안 함 (hasCode false)
                value:
                  service: { name: order-api, framework: Spring Boot 3.2 }
                  hasCode: false
                  mode: full
                  apis:
                    - { method: GET, path: /api/orders, params: [{ name: q, in: query, type: string, required: false }], auth: { required: true, role: USER }, handler: 'OrderController#list', calls: 1820 }
      responses:
        '200':
          description: 시나리오
          content:
            application/json:
              schema:
                type: object
                required: [source, items, filtered, counts]
                properties:
                  source: { type: string, enum: [llm, default] }
                  fallback:
                    description: '`source: default`일 때만 오는 선택 필드 — 기본 항목이 된 이유. `no-key` 키 없음 · `timeout` 60초 초과 · `llm-error` 호출 실패(인증 · 한도 · 서버 · 연결 · 모델 · 주소 막힘을 묶음, 키 상태를 드러내지 않는다) · `format` 응답 형식 틀림 · `all-filtered` LLM 항목이 전부 걸러짐 · `recheck` 재검사(LLM을 안 부름). `source: llm`이면 키 자체가 없다. 화면에 보이지 않고 Spring은 읽지 않아도 된다(원인은 AI 서버 로그로 본다)'
                    type: string
                    enum: [no-key, timeout, llm-error, format, all-filtered, recheck]
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ScenarioItem' }
                  filtered:
                    type: array
                    items:
                      type: object
                      required: [api, reason]
                      properties:
                        api: { type: string }
                        reason: { type: string }
                  counts: { $ref: '#/components/schemas/AreaCounts' }
              examples:
                llm:
                  summary: AI가 만든 항목 (요청 full) — 효과 적은 항목은 excluded, 목록에 없는 주소는 filtered
                  value:
                    source: llm
                    items:
                      - { key: perf-1, area: perf, tool: k6, title: 주문 목록 피크, api: GET /api/orders, why: '가장 많이 호출되는 API · 1,820번', params: { usersFrom: 50, usersTo: 200, durationMin: 3, shape: ramp, failP95Ms: 500, failErrorRate: 0.01 }, recommended: true, excluded: false, reused: false }
                      - { key: perf-4, area: perf, tool: k6, title: 상품 목록 대량, api: GET /api/products, why: 응답이 캐시돼 부하 효과가 적어요, params: { usersFrom: 50, usersTo: 200, durationMin: 3, shape: ramp, failP95Ms: 500, failErrorRate: 0.01 }, recommended: false, excluded: true, excludeReason: 캐시됨, reused: false }
                      - { key: sec-1, area: sec, tool: ddalkkak, title: 테스트 계정 만들기, why: 로그인이 필요한 검사에 쓸 계정이에요, params: { count: 2 }, recommended: true, excluded: false, reused: false }
                      - { key: sec-2, area: sec, tool: zap, title: 입력값 인젝션, api: GET /api/orders, why: 검색어가 쿼리에 들어가는 API예요, params: { range: wide }, recommended: true, excluded: false, reused: false }
                      - { key: sec-3, area: sec, tool: ddalkkak, title: 남의 주문 보기, api: 'GET /api/orders/{id}', why: id만으로 조회하는 API예요, params: { idCount: 20 }, recommended: true, excluded: false, reused: false }
                      - { key: code-2, area: code, tool: semgrep, title: 예외 처리, target: 전체, why: 빈 catch가 장애를 숨겨요, params: { severity: major }, recommended: true, excluded: false, reused: false }
                    filtered: [{ api: GET /api/legacy, reason: 목록에 없는 주소 }]
                    counts: { perf: 2, sec: 3, code: 1 }
                default:
                  summary: 기본 시나리오 (요청 full · 키 헤더 없음 → fallback no-key) — 호출 많은 GET 상위 3개. LLM 60초 초과 · 형식 틀림 등이어도 같은 항목이고 fallback만 timeout · format 등으로 바뀐다
                  value:
                    source: default
                    fallback: no-key
                    items:
                      - { key: perf-1, area: perf, tool: k6, title: 주문 목록 피크, api: GET /api/orders, why: '가장 많이 호출되는 GET · 1,820번', params: { usersFrom: 50, usersTo: 200, durationMin: 3, shape: ramp, failP95Ms: 500, failErrorRate: 0.01 }, recommended: true, excluded: false, reused: false }
                      - { key: perf-2, area: perf, tool: k6, title: 상품 목록 피크, api: GET /api/products, why: 두 번째로 많이 호출되는 GET · 960번, params: { usersFrom: 50, usersTo: 200, durationMin: 3, shape: ramp, failP95Ms: 500, failErrorRate: 0.01 }, recommended: true, excluded: false, reused: false }
