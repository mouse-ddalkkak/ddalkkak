          - { name: 시나리오 만들기, state: running, detail: 성능 · 보안 · 코드 품질 }
        pct: 70
        done: false
        apiCount: 14
        apiDiff: { added: 1, removed: 0, changed: 0, apis: [{ api: POST /api/coupons, change: new }] }
        aiMode: llm
