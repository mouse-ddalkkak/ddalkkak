    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    post:
      tags: [④ 화면]
      operationId: approveConnectRequest
      summary: 0-3 이 서비스 연결 허용
      description: service에 저장(연결 단계에서 저장하는 건 이것뿐)하고 서비스 토큰을 발급한다(DB에는 해시만). 허용 답과 토큰은 다음 생존 신호 응답으로 앱에 간다. 같은 앱(이름 · host · port)이 이미 있으면 그 줄에 새 토큰을 주고 옛 토큰은 401이 된다(토큰을 잃은 앱의 다시 허용, -211). 연결은 동시에 1개 — 해제하지 않은 다른 서비스가 있으면(생존 신호가 끊겼어도) 409이고 기존 연결 · 토큰은 그대로다. 해제(`disconnect`)한 뒤에만 다른 서비스를 허용한다. 해제했던 같은 앱을 다시 허용하면 그 줄을 다시 쓰고 해제 시각을 비운다(검사 이력이 이어짐, -223). 순서는 해제하지 않은 다른 서비스 확인이 먼저다 — 그런 서비스가 있으면 같은 앱의 해제한 줄이 있어도 409이고, "같은 앱이면 그 줄에 새 토큰"은 해제하지 않은 줄이 그 앱 하나뿐이거나 없을 때만이다(-223). 스타터킷이 1.1.0 전 출시본이면 서비스 토큰을 몰라 허용해도 API 목록 · 측정값이 401이라 409 `STARTER_OUTDATED`로 거절하고 저장하지 않는다. 직접 빌드한 키트(`dev` · `0.1.0-SNAPSHOT`)는 막지 않는다(-221)
      x-owner: [B2]
      x-features: [F-CONN-04]
      x-week: 1주
