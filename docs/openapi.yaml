      description: |
        - 점수는 규칙으로 계산한다(LLM 안 씀 · AI가 없어도 점수가 나온다). 미검사 항목은 점수에서 빼고, 영역 전체가 미검사면 `null`
        - 요청이 깨졌으면(`results` 없음 · 목록 아님) 400. Spring은 400을 해석 실패로 보고 "해석하지 못했어요 · 다시 해석"으로 처리한다
        - 설명은 LLM이 쓰되 응답 숫자를 원본과 대조해 없는 숫자가 든 문장은 버리고 기본 설명으로 바꾼다. AI가 없으면 ruleId별 기본 설명(`source: default`)
        - 확인됨 = 공격 성공·측정으로 입증 / 의심 = 정황 + `suspectReason`
      security: []
      x-owner: [B3, AI2]
      x-features: [F-RPT-01, F-RPT-03, F-RPT-04, F-RPT-05, F-RPT-06]
