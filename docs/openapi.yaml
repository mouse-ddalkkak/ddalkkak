        '401': { $ref: '#/components/responses/NotLoggedIn' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/runs/{id}/finish-partial:
    parameters: [{ $ref: '#/components/parameters/RunId' }]
    post:
      tags: [④ 화면]
      operationId: finishRunPartial
      summary: 5 오류 팝업 · 1 · 5 "이어서 검사할까요?"의 "여기까지 결과 보기" — 일부 완료
      description: >-
        SSE `error`로 기다리는 회차(서버 응답 멈춤 · 도구 실패), 또는 딸깍이 다시 켜져 멈춘 회차(홈 `run.state: interrupted`, -228)만 받는다. 남은 시나리오는 `중단됨`으로 두고(통과로 세지 않는다) 여기까지 결과로 결과 정리(`/ai/reports`)를 하고 회차는 partial. 다시 켜져 멈춘 회차는 도구를 띄우지 않고 그때까지 남은 줄로 정리한다. 응답은 stop과 같이 지금 회차 상태(보통 running) — 정리가 끝나면 SSE `done`(status partial)이 온다. 기다리는 회차가 아니면 404, 다시 켜져 멈춘 회차인데 같은 서비스가 검사 중이면 409 `RUN_IN_PROGRESS`(이어서 검사와 같다). 멈춤 · 도구 실패 팝업에서 30분 동안 아무것도 고르지 않아도 이것과 같다
      x-owner: [B3]
      x-features: [F-STOP-03, F-STOP-05]
      x-week: 3주
      x-jira: [S15P31A107-143, S15P31A107-228]
      responses:
        '200':
          description: 지금 회차 상태 (partial은 결과 정리 뒤 SSE done으로)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunStatusOk' }
              examples:
                running:
                  summary: 결과 정리 중 — 보통. 화면은 SSE done을 기다린다
                  value: { status: running }
                partial:
                  summary: 이미 정리가 끝남 — 화면은 바로 6으로. 가짜 모드는 이것을 쓴다
                  value: { status: partial }
        '401': { $ref: '#/components/responses/NotLoggedIn' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RunInProgress' }
  /api/runs/resume:
    post:
      tags: [④ 화면]
      operationId: resumeRun
      summary: 1 · 5 "이어서 검사할까요?" → 이어서 검사 — 멈춘 시나리오부터
      description: >-
        딸깍이 다시 켜져 멈춘 회차(홈 `run.state: interrupted`)만 받는다. 끝난 시나리오는 다시 돌리지 않고 멈춘 시나리오부터 잇는다 —
        도구를 중간부터 잇지는 못해 멈춘 시나리오는 처음부터, 코드 품질은 하나라도 끝나지 않았으면 묶음째 다시. 테스트 계정은 새로 만들지 않고
        그 회차가 만든 계정으로 다시 로그인한다. 회차는 다시 running이 되고 화면은 5로 가서 SSE를 붙인다. 끝 상태는 결과 정리 뒤 SSE `done`.
        기다리는 회차가 아니면(끝난 회차 · 그 뒤에 같은 서비스의 다른 검사가 끝남) 404, 같은 서비스가 검사 중이면 409 `RUN_IN_PROGRESS`,
        그 회차의 앱이 지금 연결돼 있지 않으면(꺼짐 · 다른 앱) 409 `SERVICE_OFFLINE`. "여기까지 결과 보기"는 `POST /api/runs/{id}/finish-partial`.
        본문은 시작(`POST /api/runs`)과 같은 `{runId}` — `/api/runs/{id}/resume`이면 `/api/runs/prepare/{id}`와 경로가 모호해져서다
      x-owner: [B2]
      x-features: [F-STOP-05]
      x-week: 3주
      x-jira: [S15P31A107-228]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunIdOnly' }
            example: { runId: run_6 }
      responses:
        '200': { description: 지금 회차 상태, content: { application/json: { schema: { $ref: '#/components/schemas/RunStatusOk' }, example: { status: running } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/NotLoggedIn' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 같은 서비스가 검사 중이거나 그 회차의 앱이 연결돼 있지 않음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                running: { value: { code: RUN_IN_PROGRESS, message: 이미 검사 중이에요 } }
                offline: { value: { code: SERVICE_OFFLINE, message: 앱이 꺼져 있어요 } }
  /api/runs/{id}/logs:
    parameters: [{ $ref: '#/components/parameters/RunId' }]
    get:
      tags: [④ 화면]
      operationId: getRunLogs
      summary: 도구 원문 로그 (5 "전체 로그" · 7 관측 근거)
      x-owner: [B3]
      x-features: [F-RES-06]
      x-week: 3주
      x-jira: [S15P31A107-142]
      parameters:
        - name: tool
          in: query
          required: false
          description: 없으면 전부. LogTag에 없는 값이면 400. 권한 점검 · 테스트 계정 만들기(시나리오 tool `ddalkkak`, 가입 거절 문구 -261)의 로그는 `auth`. `check` · `db`는 원본 로그 파일이 없어 늘 빈 값(진행 로그는 SSE · `/progress`)
          schema: { $ref: '#/components/schemas/LogTag' }
      responses:
        '200':
          description: 도구가 뱉은 원문 그대로(시각 · 태그를 붙이지 않음, 시나리오마다 `== {itemKey} … · exit=N` 머리줄. Semgrep은 코드 품질 시나리오를 한 번에 돌려 키를 쉼표로 묶은 머리줄 하나 — `== code-1,code-2 · exit=N`). tool이 없으면 원문이 있는 도구마다 `### {tool}` 머리줄을 달아 이어 붙인다. 도구 출력은 앞 200줄 · 끝 2000줄(scan.md §2-1 · §8)
          content:
            text/plain:
              schema: { type: string }
              example: |
                ### k6
                == perf-1 GET /api/orders · exit=0
                running (1m00.0s), 000/200 VUs, 12000 complete and 0 interrupted iterations
                http_req_duration..............: avg=212.4ms p(95)=487.2ms
                ### auth
                == sec-3 · 권한 점검
                [auth] 로그인 없이 관리자 GET /api/admin/users · 200 → 뚫림
                ### semgrep
                == code-1,code-2 · exit=1
                Ran 113 rules on 14 files: 3 findings.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/NotLoggedIn' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── ④ 결과 · 요청문 ─────────────────────────
  /api/runs/{id}:
    parameters: [{ $ref: '#/components/parameters/RunId' }]
    get:
      tags: [④ 화면]
      operationId: getRun
      summary: 6 결과 요약 (8 · 1 상단 검사 상태 칩(-214)에서 여는 것도 같은 것)
      description: >-
        ③ 응답을 B2가 저장한 것 + 회차 정보. AI 서버가 두 번 다 답하지 않았으면 `reportError` → 화면 "해석하지 못했어요 · 다시 해석".
        열면(6 · 8 · 1 상단 검사 상태 칩(-214) 어디서든) 서버가 그 회차를 본 것으로 표시해 `GET /api/home`의 `run.state`가 `done`에서 `none`이 된다(-214)
      x-owner: [B2]
      x-features: [F-RES-01, F-RES-02, F-HIST-03]
      x-week: 1주 API / 2주 화면
      x-jira: [S15P31A107-128, S15P31A107-139, S15P31A107-232, S15P31A107-237]
      responses:
        '200':
          description: 결과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunResult' }
        '401': { $ref: '#/components/responses/NotLoggedIn' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [④ 화면]
      operationId: renameRun
      summary: 8 · 6 프로젝트 이름 고치기
      description: 그 회차의 프로젝트 이름만 바꾼다(F-HIST-05). 회차마다 따로 저장하므로 같은 서비스의 다른 회차 이름과 연결된 서비스 이름(`service`)은 그대로다. 바꾼 뒤 `GET /api/runs` · `GET /api/runs/{id}`가 새 이름을 주고 새로고침해도 남는다. `GET /api/runs/{id}`처럼 **끝난 회차**(done · partial · stopped)만 받는다 — 없거나 아직 끝나지 않은 회차(preparing · ready · running · failed)는 404(화면 6 · 8도 끝난 회차만 보여 준다)
      x-owner: [B2]
      x-features: [F-HIST-05]
      x-week: 3주
      x-jira: [S15P31A107-232, S15P31A107-237]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectNameInput' }
      responses:
        '200':
          description: 저장한 이름(앞뒤 공백을 뗀 값)
          content:
            application/json:
              schema:
                type: object
                required: [runId, projectName]
                properties:
                  runId: { type: string }
                  projectName: { $ref: '#/components/schemas/ProjectName' }
              example: { runId: run_5, projectName: 주문 서비스 v2 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/NotLoggedIn' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/runs/{id}/report:
    parameters: [{ $ref: '#/components/parameters/RunId' }]
    post:
      tags: [④ 화면]
      operationId: retryReport
      summary: 6 "다시 해석" — 결과 원본을 다시 /ai/reports로
      x-owner: [B2]
      x-features: [F-RPT-03]
      x-week: 2주
      x-jira: [S15P31A107-136]
      responses:
        '200':
          description: 다시 해석한 결과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunResult' }
        '401': { $ref: '#/components/responses/NotLoggedIn' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: AI 서버가 또 답하지 않음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: AI_UNAVAILABLE, message: 해석하지 못했어요 · 다시 해석해 주세요 }
  /api/runs/{id}/issues/{issueId}:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - { name: issueId, in: path, required: true, schema: { type: string }, example: p2 }
    get:
      tags: [④ 화면]
      operationId: getIssue
      summary: 7 문제 상세
      description: >-
        재현 조건의 사람 수 · 시간 · 모양 · 주소는 이 회차 검사 범위(`ScenarioStore.scope`)의 그 시나리오에서, 테스트 계정 · 관측 근거 로그는 B3 `Repro.of(runId, itemKey)`에서. 관련 코드는 코드 연결이 있을 때만(`code: null`이면 접힘 숨김)
      x-owner: [B2]
      x-features: [F-RES-03, F-RES-04, F-RES-05]
      x-week: 1주 API / 2주 진짜 데이터 / 3주 코드 위치
      x-jira: [S15P31A107-128, S15P31A107-137, S15P31A107-144]
      responses:
        '200':
          description: 문제 1건
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueDetail' }
              examples:
                noCode:
                  summary: 코드 연결 없이 검사 → 관련 코드 접힘 숨김 (code null)
                  value:
                    { id: s1, itemKey: sec-2, area: sec, level: danger, certainty: confirmed, title: 검색어 하나로 모든 주문이 보여요, tech: SQL 문자열 연결 · GET /api/orders,
                      impact: 누구나 다른 사람의 주문을 꺼내 볼 수 있어요, asIs: { value: 뚫림, label: "검색어 ' OR 1=1 -- 입력 시 전체 주문" }, toBe: { value: 막힘, label: 같은 입력에 빈 결과 },
                      metrics: [{ name: 뚫린 입력값, now: 1곳, target: 0곳 }], suspectReason: null, where: GET /api/orders, cause: 검색어를 SQL 문장에 그대로 이어 붙여요,
                      fix: { recommended: 바인딩 파라미터(?)로 바꾸기, alternative: JPA 메서드 쿼리로 바꾸기 }, passCriteria: ZAP SQL 인젝션 경고 0건, penalty: 30,
                      api: GET /api/orders, code: null, evidence: ['[zap] scan complete · alerts=6 high=1'],
                      repro: { usersFrom: null, usersTo: null, durationMin: null, shape: null, api: GET /api/orders, testAccount: ddalkkak-test-7f2a }, prev: null, next: p1 }
        '401': { $ref: '#/components/responses/NotLoggedIn' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/runs/{id}/prompts:
    parameters: [{ $ref: '#/components/parameters/RunId' }]
    post:
      tags: [④ 화면]
      operationId: makePrompt
      summary: 6·7 수정 요청문 만들기 → /ai/prompts (저장 안 함)
      description: >-
        고른 문제(`issueIds`, 고른 순서 · 같은 id는 한 번만)를 ③ Issue 모양으로 묶어 `/ai/prompts`로 보내고 `text`만 돌려준다. 한 건이고 코드 위치를 찾았으면 관련 코드(`code`)를 같이, `includeLogs`가 true면 문제마다 관측 근거 로그를 붙인다. `includeLogs`가 없으면 false. 요청문은 어디에도 저장하지 않는다. "다시 생성" · 7 "원본 로그 추가 ▸"도 같은 엔드포인트를 다시 부른다. 끝난 회차가 아니거나 이 회차에 없는 문제 id가 섞여 있으면 404, 본문 모양이 틀리면 400 `BAD_REQUEST`, AI 서버가 답하지 않으면 다시 하지 않고 500 `SERVER_ERROR`
      x-owner: [B2]
      x-features: [F-PROMPT-02, F-PROMPT-04]
      x-week: 3주
      x-jira: [S15P31A107-146]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issueIds]
              properties:
                issueIds:
                  type: array
                  minItems: 1
                  items: { type: string }
                includeLogs: { type: boolean }
            examples:
              bundle: { summary: 6 담은 문제 묶음, value: { issueIds: [p2, s1, c1], includeLogs: false } }
              single: { summary: 7 한 건 · 원본 로그 추가, value: { issueIds: [p2], includeLogs: true } }
      responses:
        '200':
          description: 요청문
          content:
            application/json:
              schema:
                type: object
                required: [text]
                properties:
                  text: { type: string }
              example:
                text: "Spring Boot 3.2에서 아래 3개 문제를 고쳐 주세요.\n\n① [보안 · 위험] 검색어 하나로 모든 주문이 보여요 — GET /api/orders · OrderRepository.java:31 · 검색어 ' OR 1=1 -- 입력 시 전체 주문 뚫림 → 막힘\n② [코드 품질 · 주의] 결제 오류를 조용히 삼켜요 — PaymentService.java:113 · 빈 catch 블록 1곳 → 0곳\n③ [성능 · 주의] 주문 목록이 DB를 반복 호출해요 — GET /api/orders · OrderService.java:48 · 느린 요청 p95 · 50명 487ms → 500ms 이내 · 정황: 요청당 DB 쿼리 1,240회(N+1 의심)\n\n고치는 순서: ① → ② → ③\n요구사항: 항목별 원인 확인 → 수정 → 회귀 테스트 · 서로 영향 주는 변경은 먼저 알려 주세요"
        '400': { $ref: '#/components/responses/NoItems' }
        '401': { $ref: '#/components/responses/NotLoggedIn' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: DDALKKAK_SESSION

  parameters:
    StarterToken: { name: X-Ddalkkak-Token, in: header, required: true, description: '허용 때 heartbeat 응답으로 받은 서비스 토큰 (-211). 딸깍은 SHA-256 해시만 저장한다', schema: { type: string } }
    StarterTokenOptional: { name: X-Ddalkkak-Token, in: header, required: false, description: '저장해 둔 서비스 토큰. 허용 전 · 토큰을 아직 못 받았으면 없음', schema: { type: string } }
    RunId: { name: id, in: path, required: true, description: runId, schema: { type: string }, example: run_5 }
    RequestId: { name: id, in: path, required: true, description: 연결 요청 id, schema: { type: string }, example: req_7f2a }
    ServiceId: { name: id, in: path, required: true, description: 서비스 id (`GET /api/home`의 `service.id`), schema: { type: string }, example: svc_1 }
    AiProvider: { name: X-AI-Provider, in: header, required: false, schema: { type: string, enum: [claude, openai, custom] } }
    AiBaseUrl: { name: X-AI-Base-Url, in: header, required: false, description: '주소(http · https). claude · openai는 없으면 공식 주소, custom은 필수. claude에 주소가 있으면 게이트웨이용으로 키를 x-api-key 헤더에도 싣는다', schema: { type: string, format: uri } }
    AiKey: { name: X-AI-Key, in: header, required: false, schema: { type: string } }
    AiModel: { name: X-AI-Model, in: header, required: false, schema: { type: string } }

  responses:
    StarterTokenInvalid:
      description: 허용된 서비스인데 `X-Ddalkkak-Token`이 없거나 틀림 → 스타터킷은 저장한 토큰을 지우고 hello부터 다시
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: STARTER_TOKEN_INVALID, message: 스타터킷 토큰이 맞지 않아요 }
    NotLoggedIn:
      description: 세션 없음·만료 → 화면은 0-2로
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: NOT_LOGGED_IN, message: 다시 로그인해 주세요 }
    NotFound:
      description: 없는 id
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: NOT_FOUND, message: 찾을 수 없어요 }
    BadRequest:
      description: 본문이 깨졌거나 JSON이 아님 (400 · 405 · 415). 모든 /api/* 공통
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: BAD_REQUEST, message: 요청 형식을 확인해 주세요 }
    ServerError:
      description: 예상 못 한 서버 오류. 원인은 서버 로그에만 남는다. 모든 /api/* 공통
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: SERVER_ERROR, message: 잠시 후 다시 해 주세요 }
    RunInProgress:
      description: 이미 검사 중
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: RUN_IN_PROGRESS, message: 이미 검사 중이에요 }
    NoItems:
      description: 고른 항목이 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: NO_ITEMS, message: 항목을 하나 이상 골라 주세요 }
    InvalidUrl:
      description: 주소 형식 틀림 (AI 주소 — http · https)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: INVALID_URL, message: '주소를 확인해 주세요 · http(s)://…' }
    CodeUrlInvalid:
      description: 저장소 주소 형식 틀림 — https만, 비밀번호가 든 주소는 안 됨. AI 주소의 INVALID_URL과 문구를 가른다 (-250)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: CODE_URL_INVALID, message: '저장소 주소를 확인해 주세요 · https://…' }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string, description: 화면에 그대로 보여 줄 쉬운 말 }

    Area: { type: string, enum: [perf, sec, code], description: 성능 · 보안 · 코드 품질 }
    RunStatus: { type: string, enum: [preparing, ready, running, stopped, partial, done, failed] }
    RunStatusOk:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/RunStatus' }
    LogTag: { type: string, enum: [check, auth, zap, k6, db, semgrep] }
    ToolList:
      type: object
      required: [tools]
      properties:
        tools:
          type: array
          items: { $ref: '#/components/schemas/Tool' }
    Tool:
      type: object
      required: [name, image, state, installed, runnable, checkedAt, lastError, fix]
      properties:
        name: { type: string, enum: [k6, zap, semgrep] }
        image: { type: string, description: 딸깍이 쓰는 고정 버전 이미지 }
        state: { type: string, enum: [docker_unavailable, not_installed, not_runnable, recent_error, ok] }
        installed: { type: boolean, description: 이미지가 docker에 있음. docker에 붙지 못하면(docker_unavailable) false }
        runnable: { type: boolean, description: 시험 실행(도구별 버전 명령 — getTools 설명) 성공. 이미지가 없으면 false }
        checkedAt: { type: string, format: date-time, description: 실행 가능 여부를 마지막으로 확인한 때 (10분 캐시) }
        lastError:
          oneOf:
            - type: 'null'
            - type: object
              required: [stage, reason, cause, runId, at]
              properties:
                stage: { type: string, enum: [pull, run], description: 'pull = 이미지 받기 · run = 도구 실행' }
                reason: { $ref: '#/components/schemas/SkipReason' }
                cause: { type: string, description: 원본 로그에서 그 시나리오 구간의 끝 몇 줄 (비밀값은 ****) }
                runId: { type: string }
                at: { type: string, format: date-time }
        fix: { type: [string, 'null'], description: '조치 문구. ok면 null. docker_unavailable "Docker가 켜져 있는지 확인하세요. 딸깍이 docker에 붙지 못했어요" · not_installed "첫 검사 때 받아요. 미리 받으려면 docker pull <이미지>"(받기 실패가 있으면 아래 받기 문구) · not_runnable "docker run --rm <이미지> <버전 명령> 이 실행되는지 확인하세요" · 최근 오류 받기(pull) "네트워크를 확인하고 docker pull <이미지> 로 다시 받은 뒤 재검사하세요" · 실행(run) "원본 로그를 확인하고 재검사하세요" (-244)' }
    SkipReason:
      type: string
      enum: [계정 없음, 코드 없음, 대상 없음, 도구 오류, 결과 해석 실패, 중단됨, 부하를 주기 어려운 메서드, 미측정, 요청 구성 오류, 도구 받기 실패, 권한 점검 못 함, 앱 연결 끊김]
      description: |
        미검사 사유. 화면에 그대로 보이고 Spring이 사유별로 센다(run.skip_reason). 값은 더하기만 하고 바꾸거나 빼지 않는다(이력 호환, -235).
        어느 값이든 AI 서버 채점은 미검사로 세고(`summary.{영역}.skip` · `skipReasons`) 통과 · 실패 · 점수에 넣지 않는다. 값마다 누가 · 언제 내는지는 scan.md §9 "미검사 사유".
        - B3(결과 원본 `status: skipped`): 계정 없음 · 코드 없음 · 대상 없음 · 도구 오류(도구 실행 실패 — 컨테이너를 띄웠는데 비정상 종료 · 결과 파일 없음 · 도구를 띄우지 못함) · 결과 해석 실패 · 중단됨 · 부하를 주기 어려운 메서드(GET이 아닌 성능 시나리오, NF-07 마지막 방어선)
        - B3 새 값(-235): 요청 구성 오류(필수 파라미터를 채워도 응답의 90% 이상이 400 · 404 · 422 — 딸깍이 요청을 제대로 못 만든 것이라 성능 실패가 아님, scan.md §3, -219. ZAP도 GET API를 띄우기 전 확인 요청이 400 · 404 · 422면 낸다, scan.md §4, -262) · 도구 받기 실패(도구 이미지를 받지 못해 컨테이너를 못 띄움 — `DockerTool`이 판정, -229) · 권한 점검 못 함(계정은 있는데 목록에서 id를 못 모으는 등으로 남의 데이터 보기를 못 함 — 통과로 세지 않음, -231)
        - B3 새 값(-229): 앱 연결 끊김(검사를 시작할 때 앱이 연결돼 있지 않아 도구를 하나도 띄우지 않음 — 도구 문제가 아니라 도구 상태 최근 오류로 세지 않음. 전에는 도구 오류였다)
        - AI 서버(채점 중 판정, F-RPT-04): 중단됨(`partial`인데 위험·주의 없음) · 미측정(성능 지표 빠짐 · `skipped`인데 사유 없음) · 결과 해석 실패(항목 채점 실패) · 코드 없음(`hasCode: false`라 코드 결과 없음) · 요청 구성 오류(ZAP이 테스트 값이 거절된 선택 쿼리를 공격하지 못했고(`metrics.unattackedQueries` 1 이상) 위험·주의가 없음, -262)

    Scores:
      type: object
      description: 0–100. 영역 전체가 미검사면 null (화면은 "--")
      required: [perf, sec, code]
      properties:
        perf: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        sec: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        code: { type: [integer, 'null'], minimum: 0, maximum: 100 }
    AreaCounts:
      type: object
      required: [perf, sec, code]
      properties:
        perf: { type: integer }
        sec: { type: integer }
        code: { type: integer }

    ServiceRef:
      type: object
      required: [name, framework]
      properties:
        name: { type: string, example: order-api }
        framework: { type: string, example: Spring Boot 3.2 }

    Health:
      type: object
      required: [cpu, mem, disk, uptimeSec]
      properties:
        cpu: { type: number, minimum: 0, maximum: 1 }
        mem:
          type: object
          required: [usedMb, totalMb]
          properties: { usedMb: { type: integer }, totalMb: { type: integer } }
        disk:
          type: object
          required: [usedGb, totalGb]
          properties: { usedGb: { type: integer }, totalGb: { type: integer } }
        uptimeSec: { type: integer }

    HelloRequest:
      type: object
      required: [appName, framework, frameworkVersion, javaVersion, buildTool, starterVersion, host, port, pid, runningCommit]
      properties:
        appName: { type: string }
        framework: { type: string }
        frameworkVersion: { type: string }
        javaVersion: { type: string }
        buildTool: { type: string }
        starterVersion: { type: string }
        host: { type: string }
        port: { type: integer }
        pid: { type: integer }
        runningCommit: { type: [string, 'null'], description: git.properties가 없으면 null → 버전 비교 없이 진행 }
        artifact: { type: [string, 'null'], description: '실행 중인 jar · war 절대 경로(`java -jar`로 띄웠을 때). IDE · bootRun처럼 파일 하나로 뜨지 않았거나, 그 jar의 매니페스트에 `Main-Class` · `Start-Class`가 없으면(IntelliJ가 만든 클래스패스용 jar) null. 디컴파일 후보(F-CODE-05)에 쓴다. 옛 스타터킷은 보내지 않아 null로 본다. 1024자(service.artifact 칸)를 넘으면 hello를 거절하지 않고 null로 본다 (-224)' }
        workDir: { type: [string, 'null'], description: '앱의 작업 폴더(`user.dir`) 절대 경로. 이 폴더와 그 아래에서 jar · war 후보를 찾는다. 옛 스타터킷은 보내지 않아 null로 본다. 1024자(service.work_dir 칸)를 넘으면 hello를 거절하지 않고 null로 본다 (-224)' }
      example:
        appName: order-api
        framework: Spring Boot
        frameworkVersion: 3.2.5
        javaVersion: '17'
        buildTool: Gradle
        starterVersion: 1.4.0
        host: localhost
        port: 8080
        pid: 41822
        runningCommit: a3f9c1
        artifact: /home/me/order-api/build/libs/order-api.jar
        workDir: /home/me/order-api
    HeartbeatRequest:
      allOf:
        - type: object
          required: [requestId, serviceId]
          properties:
            requestId: { type: string }
            serviceId: { type: [string, 'null'], description: 허용 전에는 null }
        - $ref: '#/components/schemas/Health'
      example:
        requestId: req_7f2a
        serviceId: svc_1
        cpu: 0.23
        mem: { usedMb: 5018, totalMb: 8192 }
        disk: { usedGb: 38, totalGb: 80 }
        uptimeSec: 309600
    HeartbeatResponse:
      type: object
      required: [status, serviceId, commands]
      properties:
        status: { type: string, enum: [pending, approved, ignored], description: 'ignored를 받아도 같은 요청으로 신호를 계속 보낸다 — 0-3 ② "다시 찾기"가 되살리면 pending(-251). v1.2.2까지 스타터킷은 앱이 다시 켜질 때까지 멈췄다' }
        serviceId: { type: [string, 'null'], description: approved일 때만 값 }
        token: { type: string, description: '막 허용됐을 때만 있다. 이 토큰을 실은 신호가 올 때까지 매번 실린다 (-211)' }
        commands:
          type: array
          items:
            type: object
            required: [type]
            properties:
              type: { type: string, enum: [SEND_APIS, MEASURE_START, MEASURE_STOP] }
              snapshotId: { type: string, description: SEND_APIS }
              runId: { type: string, description: MEASURE_START · MEASURE_STOP }
              intervalSec: { type: integer, description: MEASURE_START }
      example:
        status: approved
        serviceId: svc_1
        commands:
          - { type: SEND_APIS, snapshotId: snap_12 }
          - { type: MEASURE_START, runId: run_5, intervalSec: 1 }

    ApiEndpoint:
      type: object
      description: 실제 데이터 값 없이 모양만
      required: [method, path, params, auth, handler, calls]
      properties:
        method: { type: string, enum: [GET, POST, PUT, PATCH, DELETE] }
        path: { type: string, pattern: '^/', maxLength: 512, description: '`/`로 시작해야 한다. 아니면 `/starter/v1/apis`가 400 — `@host/…`처럼 검사 요청의 호스트를 바꾸지 못하게 (-210)', example: '/api/orders/{id}' }
        params:
          type: array
          items:
            type: object
            required: [name, in, type, required]
            properties:
              name: { type: string, description: 'body는 본문 전체를 `body` 한 개로' }
              in: { type: string, enum: [path, query, body, header, cookie], description: '쿠키(@CookieValue)는 cookie. 옛 스타터킷(-240 전)은 header로 보냈다 — 그 값은 그대로 받는다. @RequestBody는 name body(type object) 칸 하나에 더해, 객체면 그 필드마다 body 칸(-251, v1.2.3~ · 필수는 @NotNull · @NotBlank · @NotEmpty · @AssertTrue)' }
              type: { type: string, enum: [string, integer, number, boolean, object, array], description: 'JSON 타입. Long·int → integer, 소수 → number, DTO·Map → object, List → array' }
              required: { type: boolean }
        auth:
          type: object
          required: [required, role]
          properties:
            required: { type: boolean }
            role: { type: [string, 'null'] }
        handler: { type: string, example: 'OrderController#get' }
        calls: { type: integer, description: '앱이 켜진 뒤 사용자 요청 누적 횟수. 딸깍 검사 요청(`X-Ddalkkak-Scan` 헤더 — k6 · ZAP · 권한 점검 등, scan.md §2-3)은 넣지 않는다(-246). 보낼 때 리셋하지 않고 앱이 다시 켜지면 0부터' }
      example:
        method: GET
        path: '/api/orders/{id}'
        params: [{ name: id, in: path, type: integer, required: true }]
        auth: { required: true, role: USER }
        handler: 'OrderController#get'
        calls: 1820
    MeasureSample:
      type: object
      description: |
        API 하나의 1초 묶음. 요청 수는 합계, DB 값은 그 1초에 끝난 요청의 평균, 커넥션 풀은 앱 전체 값이라 같은 1초의 샘플끼리 같다.
        **null = 미측정** (0과 다르다): 스타터킷이 DataSource를 감싸지 못했으면(상속할 수 없는 클래스 · 여러 DataSource 중 일부라도) `dbQueriesPerRequest` · `dbWaitMs`가 null, HikariCP가 아니면 `pool`이 null. 화면 · 결과는 그 지표를 "미측정"으로 둔다
      required: [ts, api, requests, dbQueriesPerRequest, dbWaitMs, pool]
      properties:
        ts: { type: string, format: date-time, description: 그 1초가 시작한 시각 }
        api: { type: string, description: '`ApiEndpoint`의 "메서드 path" 그대로 (예 `GET /api/orders/{id}`)' }
        requests: { type: integer, description: 그 1초에 끝난 요청 수 (합계) }
        dbQueriesPerRequest: { type: [number, 'null'], description: 요청 1번당 DB 조회 수 (평균). null = 미측정 }
        dbWaitMs: { type: [number, 'null'], description: 요청 1번당 커넥션을 얻으려고 기다린 시간 (평균). null = 미측정 }
        pool:
          description: null = 미측정 (HikariCP가 아님)
          oneOf:
            - type: object
              required: [active, max, waiting]
              properties:
                active: { type: integer, description: 그 1초 중 최댓값 }
                max: { type: integer, description: 풀 설정값 }
                waiting: { type: integer, description: 그 1초 중 최댓값 }
            - type: 'null'

    AiCheckResult:
      type: object
      required: [ok, shown, message]
      properties:
        ok: { type: boolean }
        shown: { type: [string, 'null'], description: 헤더에 보일 이름 }
        message: { type: string }

    PerfParams:
      type: object
      required: [usersFrom, usersTo, durationMin, shape, failP95Ms, failErrorRate]
      properties:
        usersFrom: { type: integer, minimum: 10, maximum: 2000 }
        usersTo: { type: integer, minimum: 10, maximum: 2000 }
        durationMin: { type: integer, minimum: 1, maximum: 30 }
        shape: { type: string, enum: [constant, ramp, spike, step], description: 일정 · 점진 · 급증 · 계단 }
        failP95Ms: { type: integer, default: 500, description: 실패 기준 p95 }
        failErrorRate: { type: number, default: 0.01, description: 실패 기준 오류율 }
    SecParams:
      type: object
      required: [range]
      properties:
        range: { type: string, enum: [default, wide, full], description: '기본(알려진 패턴 · 120회) · 넓게(변형 포함 · 600회) · 전체(모든 조합 · 2,400회)' }
    AuthzParams:
      type: object
      description: tool이 ddalkkak(권한 점검)일 때
      required: [idCount]
      properties:
        idCount: { type: integer }
    AccountParams:
      type: object
      description: '테스트 계정 만들기(tool: ddalkkak). 이 카드를 끄면 계정이 필요한 항목은 "계정 없음"으로 건너뜀'
      required: [count]
      properties:
        count: { type: integer, minimum: 1, maximum: 5, description: 만들 계정 수 (남의 데이터를 바꾸는 검사는 2개 필요) }
    CodeParams:
      type: object
      required: [severity]
      properties:
        severity: { type: string, enum: [critical, major, all], description: 치명만 · 주요까지 · 전부 }

    ScenarioItem:
      type: object
      required: [key, area, tool, title, why, params, recommended, excluded, reused]
      properties:
        key: { type: string, example: perf-1 }
        area: { $ref: '#/components/schemas/Area' }
        tool: { type: string, enum: [k6, zap, semgrep, ddalkkak], description: '`ddalkkak`은 하나로 확정(-170): params에 `count`가 있으면 테스트 계정 만들기, `idCount`가 있으면 권한 점검' }
        title: { type: string }
        api: { type: string, description: 성능 · 보안 대상 }
        target: { type: string, description: 코드 품질 대상 }
        why: { type: string }
        params:
          oneOf:
            - $ref: '#/components/schemas/PerfParams'
            - $ref: '#/components/schemas/SecParams'
            - $ref: '#/components/schemas/AuthzParams'
            - $ref: '#/components/schemas/AccountParams'
            - $ref: '#/components/schemas/CodeParams'
        recommended: { type: boolean, description: AI 추천 여부 }
        excluded: { type: boolean, description: 효과가 적어 AI가 뺀 항목 (화면 4 점선) }
        excludeReason: { type: string }
        reused: { type: boolean, description: 재검사에서 지난 항목을 그대로 씀 }

    Finding:
      type: object
      required: [ruleId, severity]
      properties:
        ruleId: { type: string }
        name: { type: string, description: '도구 원문 이름 · 메시지 (ZAP alert 이름 · Semgrep `extra.message` · 권한 점검 이름). 채점이 모르는 ruleId면 이 글로 기본 설명을 쓴다 (-150)' }
        severity: { type: string, description: 도구 원래 값 (ZAP high·medium·low · Semgrep error·warning·info) }
        proven: { type: boolean, description: 공격 성공 · 뚫림 }
        location:
          type: object
          description: '발견 위치. 코드 품질(Semgrep)은 `file` · `line`(+ `commit`), 권한 점검의 관리자 API 발견(`ddalkkak-admin-open`)과 목록으로 샌 남의 데이터 보기 발견(`ddalkkak-list-exposure`, 위치는 새는 목록 API)은 `api`만. 채점은 `api`가 있으면 항목 `api` 대신 그것을 문제의 `where`로 쓴다 (-205)'
          properties:
            file: { type: string }
            line: { type: integer }
            commit: { type: [string, 'null'] }
            api: { type: string, description: '처음 뚫린 관리자 API — 메서드 + 경로 템플릿(값 없음, scan.md §6)', example: GET /api/admin/users }
    RawResult:
      type: object
      required: [itemKey, area, tool, status]
      properties:
        itemKey: { type: string }
        area: { $ref: '#/components/schemas/Area' }
        tool: { type: string, enum: [k6, zap, semgrep, ddalkkak] }
        api: { type: string }
        status: { type: string, enum: [done, partial, skipped] }
        skipReason: { $ref: '#/components/schemas/SkipReason' }
        params: { type: object, description: '이 회차의 항목 조건 — `ScenarioStore.scope(runId)`의 params(시나리오 값 위에 사용자가 바꾼 값을 덮은 것). `run_scope.params`는 바꾼 칸만이라 그대로 싣지 않는다. 채점에 쓴다 — k6 `failP95Ms` · `failErrorRate`(없으면 기본 500ms · 1%), ddalkkak `count`(테스트 계정 만들기, 채점에서 뺌). 빠지면 사용자가 바꾼 실패 기준이 무시된다' }
        metrics:
          type: object
          description: |
            도구별로 이 필드를 채운다. 없는 값은 넣지 않는다(0으로 채우지 않음)
            - k6 · perf: `p95Ms` · `avgMs` · `errorRate`(0–1) · `requests` + 스타터킷 측정 `dbQueriesPerRequest`(평균) · `poolWaitingMax`(최댓값) + 측정 구간 생존 신호 CPU `hostCpuMax` · `hostCpuAvg`(앱 PC 시스템 CPU 0–1, 신호가 없으면 넣지 않음, -248). 채점은 `p95Ms` · `errorRate`(통과 기준, 둘 중 하나라도 없으면 미측정)와 정황 지표를 쓴다. CPU는 근거 표에만 남기고, 단순 조회(GET · N+1 정황 없음)가 기준을 넘었는데 `hostCpuMax`가 0.8 이상이면 원인에 측정 환경 확인 안내를 붙인다(등급 · 점수는 그대로)
            - `sameQueryRatio`(같은 쿼리 반복 비율, 0–1)는 선택. 약속 ① `MeasureSample`에 원본이 없어 지금은 채우지 않는다. 있으면 채점이 정황 지표로 쓴다
            - zap · sec: `alertsHigh` · `alertsMedium` · `alertsLow` / ddalkkak · sec: `checked` · `leaked` / semgrep · code: `findingsError` · `findingsWarning` · `findingsInfo` — 표시용. 판정은 `findings`로 한다
            - zap · sec `unattackedQueries`: 테스트 값이 거절돼 OpenAPI에서 빼고 공격하지 않은 선택 쿼리 수(뺀 칸이 없으면 넣지 않음, scan.md §4, -262). 채점은 위험·주의가 없는 항목에 이 값이 1 이상이면 통과 대신 미검사(`요청 구성 오류`)로 센다
          additionalProperties: { type: number }
        findings:
          type: array
          items: { $ref: '#/components/schemas/Finding' }
        evidence:
          type: array
          items: { type: string }
          description: |
            사람이 읽는 근거 몇 줄(도구 태그 + 집계 · 개수 · 메서드+경로 템플릿 · 상태 코드). 앞 5줄이 쉬운 설명(LLM)으로 그대로 가니
            요청 · 응답 본문, 쿼리 값, 헤더, 토큰 · 비밀번호는 넣지 않는다(NF-04 · NF-05, B3가 모을 때 지킨다 · -142)
        passed:
          type: array
          description: |
            선택. 도구가 돌려 문제가 없던 검사 — ZAP에서 알림이 없던 규칙(outputSummary의 PASS 줄, 수동 규칙만), 권한 점검에서 401 · 403으로 막힌 점검 · 차단 또는 공개 데이터로 끝난 남의 데이터 보기 (-150 약속, B3가 채운다 · -200, docs/scan.md §4 · §6).
            채점이 영역 `passed[]`(이름 · 값)로 옮기고, 아는 ruleId는 한국어 이름으로 바꾼다. 여러 결과가 같은 검사(이름 · 값)를 보내면 영역에 한 줄로 합치고, 영역 `summary.pass`에도 센다(통과 수 = 통과 목록 줄 수). `skipped` 항목 · 해석에 실패한 항목 것은 넣지 않는다. 본문 · id 값 · 토큰은 넣지 않는다(evidence와 같은 규칙).
            ZAP은 테스트 값이 거절된 선택 쿼리를 빼고 돌리면(공격하지 않은 칸이 있음) `done`이어도 ZAP 규칙 통과 줄을 싣지 않는다 — 그 수는 `metrics.unattackedQueries`, evidence에 `[zap] 선택 쿼리 … 는 테스트 값이 거절돼 공격하지 않음`(scan.md §4, -262). 권한 점검이 그 결과에 붙인 관리자 API 통과 줄은 남는다
          items:
            type: object
            required: [name, value]
            properties:
              ruleId: { type: string, description: 'zap-10021 · ddalkkak-admin-open …' }
              name: { type: string, description: '도구 원문 이름 또는 "로그인 없이 관리자 GET /api/admin/users"' }
              value: { type: string, description: '"발견 없음" · "401 차단" · "20개 중 0개"' }
    RawReport:
      type: object
      description: 검사 결과 원본 (B3 `RawResults.of(runId)`)
      required: [runId, service, hasCode, conditions, results]
      properties:
        runId: { type: string }
        service: { $ref: '#/components/schemas/ServiceRef' }
        hasCode: { type: boolean }
        conditions:
          type: object
          required: [testAccount]
          properties:
            testAccount: { type: [string, 'null'] }
        results:
          type: array
          items: { $ref: '#/components/schemas/RawResult' }
      example:
        runId: run_5
        service: { name: order-api, framework: Spring Boot 3.2 }
        hasCode: true
        conditions: { testAccount: ddalkkak-test-7f2a }
        results:
          - itemKey: perf-1
            area: perf
            tool: k6
            api: GET /api/orders
            status: done
            params: { usersFrom: 50, usersTo: 200, durationMin: 3, shape: ramp, failP95Ms: 500, failErrorRate: 0.01 }
            metrics: { p95Ms: 487, avgMs: 212, errorRate: 0.008, requests: 36000, dbQueriesPerRequest: 1240, poolWaitingMax: 148, hostCpuMax: 0.62, hostCpuAvg: 0.41 }
            findings: []
            evidence: ['[k6] http_req_duration p(95)=487ms · vus=50', '[db] GET /api/orders sql.count=1240/req']
          - itemKey: sec-2
            area: sec
            tool: zap
            api: GET /api/orders
            status: done
            findings: [{ ruleId: zap-40018, name: SQL Injection, severity: high, proven: true }]
            evidence: ['[zap] scan complete · alerts=6 high=1']
            passed:
              - { ruleId: zap-10020, name: Anti-clickjacking Header, value: 발견 없음 }
              - { ruleId: zap-10035, name: Strict-Transport-Security Header, value: 발견 없음 }
              - { ruleId: ddalkkak-admin-open, name: 로그인 없이 관리자 GET /api/admin/users, value: 401 차단 }
          - itemKey: code-2
            area: code
            tool: semgrep
            status: done
            findings: [{ ruleId: out.ddalkkak.java.empty-catch, name: 예외를 삼키는 빈 catch — 장애가 조용히 묻혀요, severity: warning, location: { file: PaymentService.java, line: 113, commit: a3f9c1 } }]
            evidence: []
          - { itemKey: sec-5, area: sec, tool: zap, status: skipped, skipReason: 계정 없음 }

    AreaSummary:
      type: object
      required: [line, pass, fail, skipReason]
      properties:
        line: { type: string, description: 한 줄 요약 }
        pass: { type: integer }
        fail: { type: integer }
        skipReason:
          description: 영역 전체 미검사일 때 사유
          oneOf: [{ $ref: '#/components/schemas/SkipReason' }, { type: 'null' }]
    ReportAreaSummary:
      description: ③ 영역 요약. ④ AreaSummary에 미검사 수를 더한다 (Spring이 run.item_count · 홈 미검사 수를 셀 때 쓴다, docs/run-flow.md §4)
      allOf:
        - $ref: '#/components/schemas/AreaSummary'
        - type: object
          required: [skip, skipReasons]
          properties:
            skip: { type: integer, description: '그 영역의 미검사 항목 수 — skipped와 AI 서버가 미검사로 판정한 것(중단됨 · 미측정 · 결과 해석 실패 · 요청 구성 오류). 테스트 계정 만들기는 세지 않는다' }
            skipReasons:
              type: object
              propertyNames: { $ref: '#/components/schemas/SkipReason' }
              additionalProperties: { type: integer }
              description: '미검사 사유(`SkipReason` 값)별 수. 합은 `skip`과 같다. Spring은 세 영역을 합쳐 가장 많은 사유를 run.skip_reason(홈 "미검사 N(사유)")으로 쓴다. `skipReason`은 영역 전체가 미검사일 때만 채워져 회차 사유를 셀 수 없다'
              example: { 계정 없음: 1 }
    Issue:
      type: object
      required: [id, itemKey, area, level, certainty, title, tech, impact, asIs, toBe, metrics, suspectReason, where, cause, fix, passCriteria, penalty]
      properties:
        id: { type: string, example: p2 }
        itemKey: { type: string }
        area: { $ref: '#/components/schemas/Area' }
        level: { type: string, enum: [danger, warn], description: '위험 · 주의 (통과는 passed[])' }
        certainty: { type: string, enum: [confirmed, suspected], description: 확인됨 · 의심 }
        title: { type: string, description: '사용자용 문제 이름. 규칙 ID를 쓰지 않는다. 표에 없어 넓은 일반 이름을 받은 문제만 끝에 구분을 붙인다 — 보안(보안 취약점 · 입력값 주입)은 도구 원문 이름, 코드(보안에 취약한 코드 · 코드 품질 규칙)는 같은 위치에 같은 제목이 둘 이상일 때만 번호 ( (1) · (2) …). 코드 제목에는 도구 메시지를 붙이지 않는다 (-233 · -255)' }
        tech: { type: string, description: '{종류} · {위치}. 홈 "종류"는 첫 조각. 규칙 ID는 싣지 않는다 — 원래 ID는 원본 결과(findings[].ruleId)에만 (-233)' }
        impact: { type: string }
        asIs: { $ref: '#/components/schemas/ValueLabel' }
        toBe: { $ref: '#/components/schemas/ValueLabel' }
        metrics:
          type: array
          items:
            type: object
            required: [name, now, target]
            properties: { name: { type: string }, now: { type: string }, target: { type: string } }
        suspectReason: { type: [string, 'null'] }
        where: { type: string }
        cause: { type: string }
        fix:
          type: object
          required: [recommended, alternative]
          properties: { recommended: { type: string }, alternative: { type: [string, 'null'] } }
        passCriteria: { type: string }
        penalty: { type: integer, enum: [30, 10], description: '이 문제로 영역 점수에서 뺀 점수 — 위험 30 · 주의 10. 영역 점수 = max(0, 100 − 그 영역 penalty 합). 화면 6이 점수 근거로 보인다 (F-RPT-04, -247)' }
        ruleId: { type: [string, 'null'], description: '내부용 — 보안 · 코드 문제의 도구 규칙 ID(zap-40018 · Semgrep 규칙), 성능은 null. ③ 응답에만 싣고 Spring이 run_issue.rule_id에 저장해 코드 위치 예비 경로(semgrepSpot)를 그 규칙의 발견으로 좁힌다. ④ 화면 응답에는 싣지 않는다 (-247, !147 리뷰 1-2)' }
