        host: { type: string }
        port: { type: integer }
        pid: { type: integer }
        javaVersion: { type: string }
        buildTool: { type: string }
        requestedAt: { type: string, format: date-time }
        starterOutdated:
          type: boolean
          description: >-
            스타터킷이 1.1.0 전 출시본(hello `starterVersion`)이라 서비스 토큰을 모른다 — 허용하면 409 `STARTER_OUTDATED`. 화면은 연결 버튼 대신
            스타터킷을 올리라는 안내와 의존성 줄 복사를 보여 준다. 직접 빌드한 키트(`dev` · `0.1.0-SNAPSHOT`)는 false (-221)
      example:
        id: req_7f2a
        appName: order-api
        framework: Spring Boot
        frameworkVersion: 3.2.5
        host: localhost
        port: 8080
        pid: 41822
        javaVersion: '17'
        buildTool: Gradle
        requestedAt: '2026-10-31T10:02:11+09:00'
        starterOutdated: false

    UpdateStatus:
      type: object
      required: [current, latest, canUpdate]
      properties:
        current: { type: [string, 'null'], description: '이 서버의 출시 버전(`DDALKKAK_VERSION`, 예 1.2.1). 소스 빌드(compose · bootRun · dev 이미지)는 null — 띠 없음' }
        latest: { type: [string, 'null'], description: 'GitHub Releases latest 가 current 보다 새것이면 그 버전(앞의 v 뺌). 아니거나 확인 실패면 null — 띠 없음' }
        canUpdate: { type: boolean, description: '설치기(README docker run 한 줄)로 깐 서버 — 업데이트 버튼. false(Compose)면 docker compose pull · up -d 안내' }

    Home:
      type: object
      required: [service, health, lastRun, run, kitUrl, hostHealth]
      properties:
        kitUrl:
          type: string
          description: >-
            같은 컴퓨터의 앱(스타터킷)이 이 딸깍을 부를 주소 `http://localhost:<이 컴퓨터에서 연 포트>`. 설치기가 7777을 못 써서 다른 포트로 열었으면 그 포트다(-227 · -151).
            0-3 ①은 7777이 아니면 앱에 넣을 `DDALKKAK_URL=<kitUrl>` 줄을 보여 준다. 서비스 연결과 상관없이 늘 있다
        service:
          oneOf:
            - type: object
              required: [id, name, host, port, connected, apiCount, disconnect, starterOutdated]
              properties:
                id: { type: string }
                name: { type: string }
                host: { type: string, description: 'hello의 host. 끊겼을 때 다시 허용할 연결 요청(이름 · host · port가 같은)을 찾는 데 쓴다(-211)' }
                port: { type: integer }
                connected: { type: boolean }
                apiCount: { type: [integer, 'null'], description: 마지막으로 받은 API 목록의 개수. 아직 못 받았으면 null }
                disconnect:
                  description: >-
                    연결 점검(-223, 30초마다 · 5초 제한). 연결 불가 · 시간 초과 · 5xx를 실패로 센다. 응답이 오면(2xx · 3xx · 4xx) 성공이라 연속 실패 수가 0으로 돌아간다.
                    `needsConfirm: true`면 홈 · 0-3 ②에 해제 안내를 띄우고, 사용자가 확인해야만 해제한다(해제하면 `service: null`).
                    그 서비스가 검사 중(running)이면 세지 않고 0이다. Spring은 늘 객체를 준다(점검 전이면 `failures: 0` · `lastCheckedAt: null`) — null은 옛 Spring(-223 전)
                  oneOf:
                    - type: object
                      required: [failures, needsConfirm, lastCheckedAt]
                      properties:
                        failures: { type: integer, minimum: 0, description: '연속 실패 수. 성공하면 0, 딸깍이 다시 켜지면 0부터' }
                        needsConfirm: { type: boolean, description: '해제 안내를 띄울지 — failures >= 3이거나 생존 신호가 1분 30초 넘게 없음(-250, 검사 중엔 점검을 건너뛰고 같은 포트에 다른 앱이 뜨면 점검은 성공해서)' }
                        lastCheckedAt: { type: [string, 'null'], format: date-time, description: 마지막 점검 시각. 아직 한 번도 안 했으면 null }
                    - type: 'null'
                starterOutdated:
                  type: boolean
                  description: >-
                    업그레이드 전에 허용한 앱의 스타터킷이 1.1.0 전 출시본이다 — 토큰을 몰라 API 목록 · 측정값이 401이라 검사가 멈춘다.
                    홈 띠가 "스타터킷을 v1.1.0 이상으로 올리고 앱을 다시 켠 뒤 다시 허용"을 안내한다 (-221)
            - type: 'null'
        health:
          oneOf:
            - allOf:
                - $ref: '#/components/schemas/Health'
                - type: object
                  required: [serverTime]
                  properties:
                    serverTime: { type: string, format: date-time }
            - type: 'null'
        hostHealth:
          description: >-
            앱을 연결하기 전(`service: null`) 홈 서버 상태 게이지 값 — 딸깍 서버가 자기가 도는 곳을 잰다(-256). 서비스가 있으면(끊김 포함) null이고 게이지는 `health`(스타터킷 생존 신호)를 쓴다.
            CPU · 메모리는 딸깍 서버 JVM이 보는 값이라 컨테이너에 CPU · 메모리 한도가 있으면 그 한도 기준이고, Docker Desktop(Windows · Mac)에서는 Docker VM의 값이다.
            디스크는 딸깍 작업 폴더가 있는 디스크(컨테이너면 Docker가 이미지 · 검사 도구를 쌓는 디스크), `uptimeSec`은 딸깍 가동 시간이다.
            CPU를 못 읽으면 0이다(스타터킷과 같다)
          oneOf:
            - allOf:
                - $ref: '#/components/schemas/Health'
                - type: object
                  required: [serverTime]
                  properties:
                    serverTime: { type: string, format: date-time }
            - type: 'null'
        lastRun:
          description: B2 `RunHistory.latest()`
          oneOf:
            - type: object
              required: [runId, at, scores, topDanger, topWarn, passed, skipped]
              properties:
                runId: { type: string }
                at: { type: string, format: date-time }
                scores: { $ref: '#/components/schemas/Scores' }
                topDanger: { type: [string, 'null'], description: '위험(danger)이 있는 영역마다 "영역 개수 · 문제 종류 최대 2개" 한 줄, 성능 · 보안 · 코드 품질 순으로 줄바꿈(\n)해 잇는다. 없으면 null (-214)' }
                topWarn: { type: [string, 'null'], description: 주의(warn)를 topDanger와 같은 방식으로 }
                passed: { type: integer }
                skipped:
                  type: object
                  required: [count, reason]
                  properties:
                    count: { type: integer }
                    reason: { type: [string, 'null'] }
            - type: 'null'
        run:
          description: >-
            홈 검사 상태 칩(-214) · 이어서 검사 확인(-228). 연결 안 됐으면 null.
            `running` 회차가 돌고 있음(누르면 그 회차 5 진행) ·
            `interrupted` 딸깍이 다시 켜져 멈춤, 이어서 할지 사용자 확인 대기(-228) — 화면은 "이어서 검사할까요?"로 묻고 이어서 `POST /api/runs/resume` · 여기까지 결과 보기 `POST /api/runs/{id}/finish-partial`. 고르면 그 회차는 running이 되고, 그 뒤에 같은 서비스의 다른 검사가 끝나면 더 묻지 않는다 ·
            `done` lastRun 회차가 끝났고 결과(`GET /api/runs/{id}`)를 아직 열지 않음 — 결과를 열면 서버가 표시해 그다음부터 `none`(-214) ·
            `none` 그 밖(검사 전).
            딸깍이 다시 켜져 멈춘 회차는 `stopped`로 끝나 `lastRun`에도 잡히지만(점수 없음), 사용자가 이어서 할지 정할 때까지는 `done`이 아니라 `interrupted`다
          oneOf:
            - type: object
              required: [state, runId, interruptedAt]
              properties:
                state: { type: string, enum: [none, running, interrupted, done] }
                runId: { type: [string, 'null'], description: none이면 null }
                interruptedAt:
                  description: interrupted일 때 멈춘 단계. step · name은 `GET /api/runs/{id}/progress`의 steps와 같은 값. 그 밖에는 null
                  oneOf:
                    - type: object
                      required: [step, name]
                      properties:
                        step: { type: string, enum: [check, auth, sec, perf, code, report] }
                        name: { type: string }
                    - type: 'null'
            - type: 'null'
      example:
        service: { id: svc_1, name: order-api, host: localhost, port: 8080, connected: true, apiCount: 14, disconnect: { failures: 0, needsConfirm: false, lastCheckedAt: '2026-11-07T15:09:50+09:00' }, starterOutdated: false }
        health: { cpu: 0.23, mem: { usedMb: 5018, totalMb: 8192 }, disk: { usedGb: 38, totalGb: 80 }, uptimeSec: 309600, serverTime: '2026-11-07T15:10:00+09:00' }
        lastRun:
          runId: run_5
          at: '2026-11-07T14:35:00+09:00'
          scores: { perf: 80, sec: 70, code: 90 }
          topDanger: 보안 1 · SQL 문자열 연결
          topWarn: "성능 2 · N+1 의심 · 커넥션 풀 대기\n코드 품질 1 · 빈 catch"
          passed: 35
          skipped: { count: 11, reason: 계정 없음 }
        run: { state: none, runId: null, interruptedAt: null }
        hostHealth: null
        kitUrl: http://localhost:7777

    AiSettingInput:
      type: object
      required: [provider, baseUrl, key, model]
      properties:
        provider: { type: string, enum: [claude, openai, custom], description: 'Claude · OpenAI · 직접 URL/사내 프록시(OpenAI 호환)' }
        baseUrl: { type: [string, 'null'], description: '주소(http · https). 어느 제공자든 넣을 수 있다 — 게이트웨이 · 사내 프록시. claude · openai는 null이면 공식 주소, custom(OpenAI 호환)은 필수' }
        key: { type: string, format: password }
        model: { type: string }
      example: { provider: claude, baseUrl: null, key: sk-ant-xxxx7f2a, model: claude-sonnet-5-5 }
    AiSetting:
      type: object
      required: [provider, baseUrl, model, keyMasked, connected]
      properties:
        provider: { type: [string, 'null'], enum: [claude, openai, custom, null] }
        baseUrl: { type: [string, 'null'] }
        model: { type: [string, 'null'] }
        keyMasked: { type: [string, 'null'], example: sk-…7f2a }
        connected: { type: boolean }
      example: { provider: claude, baseUrl: null, model: claude-sonnet-5-5, keyMasked: sk-…7f2a, connected: true }

    CodeSourceInput:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [github, jar, local, none], description: 'GitHub/GitLab · 실행 파일(jar · war)에서 복원 · 내 컴퓨터 폴더 · 코드 없이 (ZIP은 /api/code-source/zip)' }
        ref: { type: [string, 'null'], description: '저장소 주소 · jar/war 경로(`GET /api/code-source/artifacts` 후보의 path) · 폴더 경로' }
        branch: { type: [string, 'null'] }
        token: { type: [string, 'null'], format: password, description: 비공개 저장소 읽기 토큰 (암호화 저장) }
    CodeSource:
      type: object
      required: [type, ref, branch, lastCommit, lastCommitAt, lastFetchedAt, sameVersion, decompiled, fileHash]
      properties:
        type: { type: string, enum: [github, jar, zip, local, none] }
        ref: { type: [string, 'null'], description: '저장소 주소 · jar/war 경로 · ZIP 파일 이름 · 폴더 경로' }
        branch: { type: [string, 'null'] }
        lastCommit: { type: [string, 'null'] }
        lastCommitAt: { type: [string, 'null'], format: date-time, description: '홈 코드 줄 "2시간 전 커밋"' }
        fileHash: { type: [string, 'null'], description: 'ZIP · jar · war 파일 sha256 앞 12자. github · local · none이면 null (-224)' }
        sameVersion: { type: [boolean, 'null'], description: '실행 중인 버전(스타터킷 runningCommit)과 같은지 · 모르면 null' }
        lastFetchedAt: { type: [string, 'null'], format: date-time }
        decompiled: { type: boolean }
      example: { type: github, ref: 'https://github.com/owner/order-api', branch: main, lastCommit: a3f9c1, lastCommitAt: '2026-11-07T12:10:00+09:00', lastFetchedAt: '2026-11-07T14:00:00+09:00', sameVersion: true, decompiled: false, fileHash: null }
    CodeArtifact:
      type: object
      required: [path, kind, from, readable, reason, sizeBytes, modifiedAt]
      properties:
        path: { type: string, description: 호스트 절대 경로 }
        kind: { type: string, enum: [jar, war] }
        from: { type: string, enum: [running, workDir], description: 'running = 지금 실행 중인 파일(hello `artifact`) · workDir = 작업 폴더에서 찾음' }
        readable: { type: boolean, description: false면 고를 수 없다 (흐리게 + reason) }
        reason: { type: [string, 'null'], description: '읽을 수 없는 이유 — "홈 폴더 밖이에요" · "딸깍 폴더 안이에요" · "읽을 권한이 없어요"' }
        sizeBytes: { type: [integer, 'null'] }
        modifiedAt: { type: [string, 'null'], format: date-time }
      example: { path: /home/me/order-api/build/libs/order-api.jar, kind: jar, from: running, readable: true, reason: null, sizeBytes: 48211033, modifiedAt: '2026-11-11T09:40:00+09:00' }
    CodeJob:
      type: object
      required: [step, done, commit, runningCommit, sameVersion, decompiled, error]
      properties:
        step: { type: string, enum: [cloning, extracting, decompiling, linking, done, failed] }
        done: { type: boolean }
        commit: { type: [string, 'null'] }
        runningCommit: { type: [string, 'null'] }
        sameVersion: { type: [boolean, 'null'], description: 둘 중 하나라도 없으면 null }
        decompiled: { type: boolean }
        error:
          oneOf: [{ $ref: '#/components/schemas/Error' }, { type: 'null' }]
      example: { step: done, done: true, commit: a3f9c1, runningCommit: a3f9c1, sameVersion: true, decompiled: false, error: null }

    ProjectName:
      type: string
      minLength: 1
      maxLength: 100
      description: 검사 프로젝트 이름(회차마다, 최대 100자 — 기본값인 서비스 이름과 같은 길이라 기본값을 자르지 않는다). 새 회차는 그 회차를 시작할 때 연결된 서비스 이름(`service`)으로 저장되고, 사용자가 `PATCH /api/runs/{id}`로 고친다. 고쳐도 다른 회차 · `service`는 안 바뀐다
      example: order-api
    ProjectNameInput:
