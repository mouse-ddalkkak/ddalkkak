  # ───────────────────────── ④ 코드 연결 ─────────────────────────
  /api/code-source:
    get:
      tags: [④ 화면]
      operationId: getCodeSource
      summary: 저장한 코드 연결 방식 (0-3 ④ · 홈 코드 줄)
      description: >-
        저장한 방식 = 0-3 ④에서 마지막으로 가져오기에 성공한 줄(github · jar · zip · local · none 모두, 실패한 줄은 건너뛴다. 검사 때 다시 가져온 줄도 같은 방식이다). 검사를 시작하면 준비가 이 방식으로 다시 가져온다(`POST /api/runs/prepare`). 없으면 `last: null` → 화면은 "딸깍 검사"에서 0-3 ④로 보낸다 (-224)
      x-owner: [B2]
      x-features: [F-CODE-01]
      x-week: 3주
      x-jira: [S15P31A107-144, S15P31A107-224]
      responses:
        '200':
          description: 지난 설정
          content:
            application/json:
              schema:
                type: object
                required: [last]
                properties:
                  last:
                    oneOf: [{ $ref: '#/components/schemas/CodeSource' }, { type: 'null' }]
              examples:
                previous: { summary: 저장한 방식 있음, value: { last: { type: github, ref: 'https://github.com/owner/order-api', branch: main, lastCommit: a3f9c1, lastCommitAt: '2026-11-07T12:10:00+09:00', lastFetchedAt: '2026-11-07T14:00:00+09:00', sameVersion: true, decompiled: false, fileHash: null } } }
                noSaved: { summary: 저장한 방식 없음 → 0-3 ④, value: { last: null } }
        '401': { $ref: '#/components/responses/NotLoggedIn' }
    post:
      tags: [④ 화면]
      operationId: postCodeSource
      summary: 0-3 ④ 코드 연결 저장 · 한 번 가져와 확인
      description: >-
        0-3 ④에서 부른다. 한 번 가져와 보고, 성공하면 그 방식이 저장한 방식이 된다(`GET /api/code-source`의 `last`). 검사를 시작할 때마다 준비가 같은 방식으로 다시 가져오므로 화면은 검사 때 이걸 부르지 않는다 (-224). 코드 자체는 DB에 넣지 않고 "어디서 가져올지"만 code_source에 둔다. 토큰은 암호화(응답 · 로그에 나오지 않는다). `type: none`이면 줄만 남기고 바로 끝나 `jobId: null`(코드 품질 OFF를 저장). `jar`는 JAR와 WAR 둘 다다 — ref가 `.war`로 끝나면 `WEB-INF/classes`, 아니면 `BOOT-INF/classes`(없으면 통째)를 디컴파일한다. 화면은 경로를 직접 받지 않고 `GET /api/code-source/artifacts` 후보 중 고른 `path`를 ref로 보낸다. `github`는 https 저장소 주소(비밀번호가 든 주소는 400 `CODE_URL_INVALID`)와 branch(비우면 기본 브랜치), 같은 주소로 가져오는 데 성공한 줄이 있으면 `token`이 null이어도 그중 가장 최근 줄의 토큰을 이어 쓴다(실패한 줄은 건너뛴다). `jar` · `local`은 딸깍 설치 서버의 홈 폴더 아래 절대 경로이고(`~/.ddalkkak` 아래는 안 된다), 어긋나면 이 응답이 아니라 작업 `error`(`CODE_PATH_INVALID`)로 나온다. ref · branch · token이 저장 칸보다 길면(ref 512자 · branch 100자) 400 `BAD_REQUEST`(공통)
      x-owner: [B2]
      x-features: [F-CODE-01, F-CODE-02, F-CODE-04, F-CODE-05]
      x-week: 2주 코드 없이 / 3주 나머지
      x-jira: [S15P31A107-133, S15P31A107-144, S15P31A107-224]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CodeSourceInput' }
            examples:
              github: { value: { type: github, ref: 'https://github.com/owner/order-api', branch: main, token: null } }
              war: { summary: 후보에서 고른 WAR, value: { type: jar, ref: /home/me/shop/target/shop.war, branch: null, token: null } }
              none: { value: { type: none } }
      responses:
        '200':
          description: 가져오기 시작 (진행은 jobs로)
          content:
            application/json:
              schema:
                type: object
                required: [jobId]
                properties:
                  jobId: { type: [string, 'null'] }
              example: { jobId: job_3 }
        '400': { $ref: '#/components/responses/CodeUrlInvalid' }
        '401': { $ref: '#/components/responses/NotLoggedIn' }
        '409':
          description: 연결된 서비스가 없음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: SERVICE_OFFLINE, message: 앱이 꺼져 있어요 }
  /api/code-source/zip:
    post:
      tags: [④ 화면]
      operationId: uploadCodeZip
      summary: 0-3 ④ 코드 ZIP 올리기 · 보관
      description: 마지막으로 올린 ZIP 하나를 `~/.ddalkkak/code/{serviceId}/source.zip`에 풀어 보고, 풀기에 성공해야 앞의 것을 지우고 바꿔 보관하며 저장한 방식이 된다(실패한 ZIP은 보관하지 않아 앞의 저장한 방식이 그대로다). 검사를 시작할 때 다시 올리지 않아도 이 파일을 다시 푼다. 소스 식별자는 파일 sha256 앞 12자(`fileHash`) (-224)
      x-owner: [B2]
      x-features: [F-CODE-02]
      x-week: 3주
      x-jira: [S15P31A107-144, S15P31A107-224]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: 풀기 시작
          content:
            application/json:
              schema:
                type: object
                required: [jobId]
                properties:
                  jobId: { type: string }
              example: { jobId: job_4 }
        '400':
          description: ZIP 깨짐
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: ZIP_INVALID, message: 압축을 풀 수 없어요 }
        '401': { $ref: '#/components/responses/NotLoggedIn' }
        '409':
          description: 연결된 서비스가 없음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: SERVICE_OFFLINE, message: 앱이 꺼져 있어요 }
        '413':
          description: 파일이 200MB(`spring.servlet.multipart.max-file-size`)를 넘음. 로그인 확인보다 먼저 온다. 크게 넘으면 서버(Tomcat)가 이 응답 없이 연결을 끊으니 화면이 올리기 전에 크기를 본다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: BAD_REQUEST, message: 요청 형식을 확인해 주세요 }
  /api/code-source/artifacts:
    get:
      tags: [④ 화면]
      operationId: getCodeArtifacts
      summary: 0-3 ④ 디컴파일 후보 (JAR · WAR)
      description: >-
        연결된 서비스가 hello로 알려 준 실행 파일(`artifact`) 하나와 작업 폴더(`workDir`)와 그 아래 3단계에서 `*.jar` · `*.war`만 찾는다(`.git` · `node_modules` · `.gradle` 건너뜀, 최대 50개, 실행 중인 파일이 맨 앞 · 나머지는 최근 수정순). 서버의 다른 경로는 찾지 않는다. `/host-home`으로 바꾼 `workDir`이 홈 밖(예 `user.dir`이 `/` · `/opt/app`) · 홈 자체 · `~/.ddalkkak` 아래면 폴더는 찾지 않고 `artifact` 한 줄만 본다(서버 컨테이너의 `/`를 훑지 않게, !127 리뷰).
