        '401': { $ref: '#/components/responses/NotLoggedIn' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/runs/{id}/stop:
    parameters: [{ $ref: '#/components/parameters/RunId' }]
    post:
      tags: [④ 화면]
      operationId: stopRun
      summary: 5 중단 ("중단" · 오류 팝업 "중단")
      description: 도구 컨테이너를 멈추고 여기까지 결과를 저장한다. 결과 정리 · 회차 상태는 B2 `RunLifecycle.onScanFinished(STOPPED)` (docs/run-flow.md §1). 응답은 지금 회차 상태라 보통 running이다 — 결과 정리(AI 해석 · 저장, 최대 약 2분 20초)가 끝나야 stopped가 되고 SSE `done`으로 알린다. 그동안 목록에도 running이고 새 검사는 409라, 화면은 `done`을 받고 넘어간다. 이미 결과 정리 중이면 멈추지 않는다
      x-owner: [B3]
      x-features: [F-RUN-11, F-STOP-03]
      x-week: 1주 화면(가짜) / 2주 연결
      x-jira: [S15P31A107-134]
      responses:
        '200':
          description: 지금 회차 상태 (stopped는 결과 정리 뒤 SSE done으로)
          content:
