  # ───────────────────────── ④ 연결 · 홈 ─────────────────────────
  /api/services/requests:
    get:
      tags: [④ 화면]
      operationId: listConnectRequests
      summary: 0-3 ② 연결할 수 있는 서비스 목록 · 다시 찾기 (5초마다)
      description: 대기 중인 요청 전체, 최근 것부터. 스타터킷이 hello를 보낸 앱이 곧 연결할 수 있는 서비스다 — 딸깍이 포트를 훑지 않는다(-223). 화면은 목록에서 하나를 골라 허용 · 무시하고, "다시 찾기"는 `again=true`로 이 목록을 바로 다시 받는다 — "아니에요"로 무시한 요청도 무시 뒤 신호가 두 번 이상 왔고 30초 안에 신호가 있으면 다시 대기로 되돌려 목록에 넣는다(-251). 옛 스타터킷(v1.2.2까지)은 무시 뒤 신호를 한 번 보내고 멈추니 되살리지 않는다 — 허용하면 토큰을 받아 갈 신호가 없다. 5초 새로고침은 `again` 없이 부르니 무시한 요청이 저절로 다시 뜨지 않는다. 정상 연결 중(`GET /api/home`의 `service.connected`가 true이고 해제 확인 필요가 아님)이면 화면은 이 목록 · 승인 화면을 보여 주지 않는다. 끊겼으면 목록을 보여 같은 앱 다시 허용(-211)은 되고, 다른 앱 허용은 409다. hello마다 요청 하나이고, 30초 동안 생존 신호가 없는 요청은 뺀다(-211). 비어 있으면 화면은 0-3 ② 서비스 연결에서 "연결 요청을 기다리고 있어요"로 기다린다. 스타터킷이 1.1.0 전 출시본이면 `starterOutdated`가 true다 — 허용하면 409라 화면은 연결 버튼 대신 스타터킷을 올리라는 안내와 의존성 줄 복사를 보여 준다(-221). 홈(1)은 서비스가 끊겼을 때만 불러 요청이 하나라도 있으면 딸깍 검사를 0-3 ② 서비스 연결로 보낸다 — 같은 앱이면 다시 허용(-211), 다른 앱이면 허용이 409라 모달의 "기존 연결 해제"로 바꾼다(-223)
      x-owner: [B2]
      x-features: [F-CONN-03]
      x-week: 1주
      x-jira: [S15P31A107-118, S15P31A107-181, S15P31A107-211, S15P31A107-223, S15P31A107-251, S15P31A107-221]
      parameters:
        - { name: again, in: query, required: false, description: '"다시 찾기"면 true — 무시 뒤 신호가 두 번 이상 왔고 30초 안에 신호가 있는 무시한 요청을 다시 대기로 (-251). 옛 스타터킷(v1.2.2까지)은 무시 뒤 신호 한 번에 멈춰 되살리지 않는다', schema: { type: boolean, default: false } }
      responses:
        '200':
          description: 대기 중 요청 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConnectRequest' }
              examples:
                oldKit: { summary: 스타터킷 1.0.0 → 연결 버튼 대신 올리라는 안내 (-221), value: [{ id: req_7f2a, appName: order-api, framework: Spring Boot, frameworkVersion: 3.2.5, host: localhost, port: 8080, pid: 41822, javaVersion: '17', buildTool: Gradle, requestedAt: '2026-10-31T10:02:11+09:00', starterOutdated: true }] }
        '401': { $ref: '#/components/responses/NotLoggedIn' }
