                      - { key: sec-1, area: sec, tool: ddalkkak, title: 테스트 계정 만들기, why: 로그인이 필요한 검사에 쓸 계정이에요, params: { count: 2 }, recommended: true, excluded: false, reused: false }
                      - { key: sec-2, area: sec, tool: ddalkkak, title: 남의 데이터 보기, api: 'GET /api/orders/{id}', why: 주소의 id만 바꿔 남의 데이터가 보이는지 봐요, params: { idCount: 20 }, recommended: true, excluded: false, reused: false }
