    post:
      tags: [④ 화면]
      operationId: startRun
      summary: 4 "딸깍" — 검사 시작
      description: 순서는 연결 확인 → 테스트 계정 → 1 보안(ZAP) → 2 성능(k6) → 3 코드 품질(Semgrep, 코드 있을 때만) → 결과 정리. 한 단계가 실패해도 다음으로 가고 실패한 항목은 미검사(사유)
      x-owner: [B3]
