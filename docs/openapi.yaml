  /api/runs/prepare/{id}/auth:
    parameters: [{ $ref: '#/components/parameters/RunId' }]
    get:
      tags: [④ 화면]
      operationId: getAuth
      summary: 4 로그인 줄 — 로그인 구조 분석 · 지금 상태
      description: >-
        검사 대상 앱 로그인 설정(서비스마다 하나, 다음 검사에서도 그대로). 분석은 이 회차 API 목록만 보고 고객 앱에 요청하지 않는다 —
        가입 · 로그인 API는 테스트 계정과 같은 이름 규칙(scan.md §7), `fields`는 로그인 API의 body 칸 이름(칸 정보가 없으면 흔한 칸
        `email` · `username` · `password`를 싣고 `fieldsGuessed: true`). 로그인 값의 자리(`tokenAt`)는 요청 없이는 알 수 없어 계정으로
        확인할 때 첫 로그인 응답에서 정한다. `state`가 `none`이면 확인 전 — 검사는 고객 앱에 가입 · 로그인 요청을 보내지 않고 로그인이
        필요한 시나리오는 미검사(계정 없음). `expired`(거절된 토큰 · 쿠키, 다시 로그인하지 못한 계정)와 `key_lost`(master.key가 바뀌어
        저장한 값을 지움)는 다시 등록해 달라는 상태. 값은 내주지 않고 가린 `hint`만 준다. 마지막으로 쓴 지 30일이 지나면 지워져 `none`이 된다
      x-owner: [B3]
      x-features: [F-SCOPE-09, F-RUN-03]
      x-week: 3주
      x-jira: [S15P31A107-230]
      responses:
        '200':
          description: 로그인 설정
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSetting' }
              examples:
                none:
                  summary: 확인 전
                  value: { state: none, analysis: { loginApi: POST /api/auth/login, signupApi: POST /api/auth/signup, fields: [email, password], fieldsGuessed: false }, mode: null, hint: null, tokenAt: null, lastUsedAt: null }
                ok:
                  summary: 딸깍이 만든 계정으로 확인함
                  value: { state: ok, analysis: { loginApi: POST /api/auth/login, signupApi: POST /api/auth/signup, fields: [email, password], fieldsGuessed: false }, mode: account, hint: dd…7f2a, tokenAt: body.token, lastUsedAt: '2026-11-12T14:20:00+09:00' }
                expired:
                  summary: 등록한 토큰이 거절됨 — 다시 넣어 달라고 한다
                  value: { state: expired, analysis: { loginApi: POST /api/auth/login, signupApi: POST /api/auth/signup, fields: [email, password], fieldsGuessed: false }, mode: token, hint: …a1b2, tokenAt: null, lastUsedAt: '2026-11-12T14:20:00+09:00' }
                key_lost:
                  summary: master.key가 바뀌어 저장한 값을 지움
                  value: { state: key_lost, analysis: { loginApi: POST /api/auth/login, signupApi: POST /api/auth/signup, fields: [email, password], fieldsGuessed: false }, mode: cookie, hint: 'SESSION=****', tokenAt: null, lastUsedAt: '2026-11-12T14:20:00+09:00' }
        '401': { $ref: '#/components/responses/NotLoggedIn' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [④ 화면]
      operationId: putAuth
      summary: 4 로그인 확인 · 등록 — 계정 · 토큰 · 쿠키
      description: >-
        사용자가 분석 결과를 보고 [확인]해야 처음으로 고객 앱에 로그인 요청을 보낸다. 계정(`mode: account`)은 그 자리에서 로그인해 값의
        자리를 찾는다 — `create: true`면 딸깍이 `ddalkkak-test-xxxx` 계정을 가입시키고, 아니면 사용자가 준 아이디 · 비밀번호로 로그인만 한다.
        토큰 · 쿠키는 요청 없이 저장한다(`Bearer ` · `Cookie:` 앞머리는 떼어 낸다). 값은 master.key로 암호화해 서비스마다 하나 저장하고 다음
        검사에서 다시 쓴다(다시 보내면 덮는다). 확인한 뒤에는 방식과 상관없이 검사 때 권한 점검용 테스트 계정도 만든다. 비었거나 줄바꿈 등
        제어 문자가 있거나 4096바이트를 넘으면 400 `BAD_REQUEST`. 로그인 · 가입 API가 없으면 400 `NO_LOGIN_API`, 로그인이 거절되거나 값이
        없으면 400 `TARGET_LOGIN_FAILED`(401은 화면이 관리자 로그아웃으로 보니 쓰지 않는다), 앱이 꺼져 있으면 409 `SERVICE_OFFLINE`.
        `create: true`인데 고객 앱 가입이 4xx면 400 `TARGET_SIGNUP_FAILED` — message가 고정 문구 뒤에 ` · 앱 응답 {상태}: {앱 문구}`를
        붙인다(앱 응답의 errors[] · message · error · detail · title 중 문구, 보낸 비밀번호는 `****`, 200자까지, -261). 가입 5xx는 `TARGET_LOGIN_FAILED`
      x-owner: [B3]
      x-features: [F-SCOPE-09, F-RUN-03]
      x-week: 3주
      x-jira: [S15P31A107-230, S15P31A107-261]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthInput' }
            examples:
              create: { summary: 딸깍이 테스트 계정 만들기, value: { mode: account, create: true } }
              account: { summary: 내 계정, value: { mode: account, username: me@shop.com, password: '********' } }
              token: { summary: 토큰 직접 등록, value: { mode: token, token: 'eyJhbGciOi…' } }
              cookie: { summary: 쿠키 직접 등록, value: { mode: cookie, cookie: 'SESSION=3f9a…' } }
      responses:
        '200':
          description: 저장한 로그인 설정
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSetting' }
              example: { state: ok, analysis: { loginApi: POST /api/auth/login, signupApi: POST /api/auth/signup, fields: [email, password], fieldsGuessed: false }, mode: account, hint: me….com, tokenAt: body.token, lastUsedAt: '2026-11-12T14:20:00+09:00' }
        '400':
          description: 넣은 값이 틀렸거나 로그인하지 못함
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                noLogin: { value: { code: NO_LOGIN_API, message: 가입 · 로그인 API를 찾지 못했어요 · 토큰이나 쿠키를 넣어 주세요 } }
                failed: { value: { code: TARGET_LOGIN_FAILED, message: 로그인하지 못했어요 · 아이디 · 비밀번호를 확인하거나 토큰 · 쿠키를 넣어 주세요 } }
                signupFailed: { summary: '딸깍이 계정 가입을 앱이 거절 — 앱 문구가 뒤에 붙는다', value: { code: TARGET_SIGNUP_FAILED, message: '테스트 계정을 만들지 못했어요 · 가입 규칙을 확인하거나 내 계정 · 토큰 · 쿠키를 넣어 주세요 · 앱 응답 400: 닉네임은 필수입니다' } }
                bad: { value: { code: BAD_REQUEST, message: 요청 형식을 확인해 주세요 }, summary: '모르는 mode · 빈 값 · 줄바꿈 · 4096바이트 넘음 · = 없는 쿠키' }
        '401': { $ref: '#/components/responses/NotLoggedIn' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 앱이 꺼져 있어 로그인할 수 없음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: SERVICE_OFFLINE, message: 앱이 꺼져 있어요 }

  # ───────────────────────── ④ 실행 ─────────────────────────
  /api/runs:
    get:
      tags: [④ 화면]
      operationId: listRuns
      summary: 8 이력 · 점수 변화
      description: 지금 연결된 서비스(해제하지 않은 줄)의 끝난 회차. 연결된 서비스가 없으면(해제 뒤) 빈 목록이다. 해제한 서비스의 회차는 지우지 않고 결과(`GET /api/runs/{id}`)는 계속 열리며, 같은 앱을 다시 허용하면 다시 보인다(-223)
      x-owner: [B2]
      x-features: [F-HIST-01, F-HIST-02]
