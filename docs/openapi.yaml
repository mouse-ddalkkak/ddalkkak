                  summary: 결과 정리 중 — 보통. 화면은 SSE done을 기다린다
                  value: { status: running }
                stopped:
                  summary: 이미 정리가 끝남 — 화면은 바로 1로. 가짜 모드는 이것을 쓴다 (중단 → 1)
                  value: { status: stopped }
        '401': { $ref: '#/components/responses/NotLoggedIn' }
        '404': { $ref: '#/components/responses/NotFound' }
