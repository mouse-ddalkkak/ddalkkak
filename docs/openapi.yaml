            required: [name, state, detail]
            properties:
              name: { type: string }
              state: { type: string, enum: [done, running, waiting, skipped], description: 완료 · 진행 · 대기 · 건너뜀 }
              detail: { type: string }
        pct: { type: integer, minimum: 0, maximum: 100 }
        done: { type: boolean }
        apiCount: { type: [integer, 'null'] }
        apiDiff:
          oneOf:
            - type: object
              required: [added, removed, changed, apis]
              properties:
                added: { type: integer }
                removed: { type: integer }
                changed: { type: integer }
                apis:
                  type: array
                  description: 바뀐 API (새로 생김 · 없어짐 · 바뀜)
                  items:
                    type: object
                    required: [api, change]
                    properties:
                      api: { type: string }
                      change: { type: string, enum: [new, removed, changed] }
            - type: 'null'
          description: 첫 검사면 null
        aiMode: { type: [string, 'null'], enum: [llm, default, null] }
        error:
          description: 준비 실패 (앱 꺼짐 · API 0개 · 목록 안 옴)
