spring.application.name=ddalkkak-server
server.port=7777

# DB 주소는 compose 가 넣는다. 비어 있으면 H2 메모리 DB (테스트 · bootRun)
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
# 테이블은 db/migration 의 SQL 이 만든다 (docs/db.md §6). 엔티티가 테이블과 다르면 서버가 안 뜬다
spring.jpa.hibernate.ddl-auto=validate
# 파일 이름이 시각이라 늦게 머지된 옛 시각 파일도 돌린다
spring.flyway.out-of-order=true

# AI 서버. compose 는 http://localhost:8000 을 넣는다 (server 가 host 네트워크)
ddalkkak.ai.url=${AI_BASE_URL:http://localhost:8000}
# /ai/check 를 기다리는 시간. AI 서버 안 시험 호출(10초)보다 길어야 한다 (docs/api.md 타임아웃)
ddalkkak.ai.check-timeout=15s
# /ai/scenarios 를 기다리는 시간. AI 서버 안 LLM 60초보다 길어야 한다
ddalkkak.ai.scenarios-timeout=70s
# /ai/reports 를 기다리는 시간. 안쪽 LLM 60초보다 길어야 한다. 무응답이면 1번 더 불러서 결과 정리는 최대 약 2분 20초
ddalkkak.ai.reports-timeout=70s
# /ai/prompts 를 기다리는 시간. 안쪽 LLM 30초보다 길어야 한다. 다시 하지 않는다 (화면 "다시 생성")
ddalkkak.ai.prompts-timeout=40s
# 준비 2줄에서 B1 ApiCatalog.requestLatest(20초 + 1번 다시)를 기다리는 시간. 넘으면 앱이 꺼진 것으로 본다
ddalkkak.prepare.api-timeout=50s
# SEND_APIS 뒤 목록을 기다리는 시간. 넘으면 같은 snapshotId 로 1번 더, 그만큼 더 기다려도 없으면 SERVICE_OFFLINE (F-API-02)
ddalkkak.starter.api-wait=20s

# 코드 가져오기 (docs/run-flow.md §5)
# 작업 폴더. 서버 컨테이너 안에서는 /root/.ddalkkak/work 다 (compose 는 ~/.ddalkkak, 설치 스크립트는 볼륨 ddalkkak-data 를 붙인다)
ddalkkak.code.work-dir=${user.home}/.ddalkkak/work
# local · jar 경로가 이 폴더 아래여야 한다. 사용자가 적는 건 호스트 경로라 Windows(C:\Users\me) · Mac(/Users/me) · Linux(/home/me) 일 수 있다.
# 설치 스크립트 · compose 가 호스트 홈 글자를 HOST_HOME 에 넣는다. 없으면 이 컴퓨터의 홈
ddalkkak.code.host-home=${HOST_HOME:${user.home}}
# 호스트 홈이 서버 컨테이너 안에서 붙은 폴더(설치 스크립트 · compose 는 /host-home). 비어 있으면 적은 경로를 그대로 쓴다(bootRun).
# 있으면 적은 경로의 host-home 앞자리를 이 폴더로 바꿔 읽는다 — Docker Desktop 에서는 호스트 경로 모양이 컨테이너 안에 없어서다
ddalkkak.code.home-mount=${HOME_MOUNT:}
ddalkkak.code.vineflower=/opt/vineflower.jar
# GitHub 주소로 받는 scheme. 콜론이 아니라 쉼표로 나눈다. 시험만 file 을 더한다(file 은 홈 밖 저장소를 읽을 수 있다)
ddalkkak.code.git-schemes=https
# git clone · Vineflower 하나가 걸리는 최대 시간
ddalkkak.code.fetch-timeout=10m
# ZIP 올리기 한도(기본 1MB)
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# 검사 결과 · 원본 로그 (docs/scan.md §2-2 · §8). runs/{runId}/out 은 도구 컨테이너에 붙이고, runs/{runId}/raw 에 도구 원문 로그
ddalkkak.scan.home=${user.home}/.ddalkkak
# 켜질 때 지난 실행에서 남은 도구 컨테이너(라벨 io.ddalkkak.tool)를 지운다 (docs/scan.md §2 · -197). 서버 테스트는 build.gradle 에서 끈다
ddalkkak.scan.cleanup-leftovers=true

# 검사 대상 앱을 부르는 호스트 이름(k6 · ZAP · 멈춤 감지 · 권한 점검 · 로그인 확인). 서버를 호스트에서 바로 띄우면 localhost.
# Docker Desktop(Windows · Mac) 컨테이너 안의 localhost 는 컨테이너 자신이라 설치 스크립트가 host.docker.internal 을 넣는다
ddalkkak.target-host=${TARGET_HOST:localhost}
# 도구 컨테이너(k6 · ZAP · Semgrep)의 docker run --network. Linux 는 host. Docker Desktop 의 host 네트워크는 호스트의 127.0.0.1 에 닿지 못해
# 설치 스크립트가 기본 bridge 를 넣는다 (그때 target-host 는 host.docker.internal)
ddalkkak.tool-network=${TOOL_NETWORK:host}
# 서버 컨테이너 안 /root/.ddalkkak 이 붙은 폴더의 호스트 쪽 경로. 도구 컨테이너의 -v 는 호스트 경로여야 해서 쓴다(docs/scan.md §2-2).
# compose 는 ${HOME}/.ddalkkak, 설치 스크립트는 이름 붙인 볼륨의 Mountpoint 를 넣는다. 서버를 호스트에서 바로 띄우면 비워 둔다
ddalkkak.data-host-dir=${DATA_HOST_DIR:}

# 쿠키는 포트를 가리지 않는다. 같은 서버의 고객 앱 쿠키(JSESSIONID · Spring Session 의 SESSION)와 겹치지 않는 이름
server.servlet.session.cookie.name=DDALKKAK_SESSION
server.servlet.session.cookie.same-site=lax
