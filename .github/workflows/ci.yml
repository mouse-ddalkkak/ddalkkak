# PR · main 마다 테스트를 돈다. 무엇을 돌리는지는 CONTRIBUTING.md "빌드 · 테스트" 표와 같다.
# main 보호 ruleset 이 아래 job 이름을 필수 검사로 건다 — job 이름을 바꾸면 ruleset 도 같이 바꾼다.
# 액션은 커밋 SHA 로만 쓴다(저장소 설정이 강제). 올릴 때는 SHA 와 # vX.Y.Z 주석을 같이 바꾼다.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: server/*.gradle*
      - run: ./gradlew build --no-daemon
        working-directory: server
      - run: sh server/start.test.sh

  starter-kit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        boot: ["3.2.12", "4.1.2"] # 3.2.12 = build.gradle compileBoot(./gradlew test 기본)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: starter-kit/*.gradle*
      - run: ./gradlew test --no-daemon -PbootVersion=${{ matrix.boot }}
        working-directory: starter-kit

  order-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            examples/order-api/*.gradle*
            starter-kit/*.gradle*
      - run: ./gradlew test --no-daemon
        working-directory: examples/order-api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build && npm test
        working-directory: web

  ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ai/requirements*.txt
      - run: pip install -r requirements-dev.txt && python -m pytest
        working-directory: ai

  # openapi.yaml 오류 0 · contracts/ 가 openapi.yaml 예시와 같은지
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npx --yes @redocly/cli@1.34.3 lint docs/openapi.yaml
      - run: python3 scripts/screen_contracts.py && git status --porcelain contracts/ && test -z "$(git status --porcelain contracts/)"
