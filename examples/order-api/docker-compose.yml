# order-api 자체 DB. 딸깍 DB와 별개. 앱은 호스트에서 ./gradlew bootRun (README)
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orderapi
      POSTGRES_USER: orderapi
      POSTGRES_PASSWORD: orderapi
    ports:
      - "127.0.0.1:5433:5432" # 내 컴퓨터의 PostgreSQL(5432)과 겹치지 않게 · 이 컴퓨터에서만 (팀 서버에 상시 떠 있다)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U orderapi -d orderapi"]
      interval: 2s
      timeout: 3s
      retries: 30
